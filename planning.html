<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BATIFLOW — Planning chantier</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

header{
    background:#0f172a;
    color:white;
    padding:18px 25px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#f28c28;
}

.header-title{
    margin-top:4px;
    color:#cbd5e1;
    font-size:14px;
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:700;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.button-primary{
    background:#f28c28;
    color:white;
}

.button-primary:hover{
    background:#d97706;
}

.button-secondary{
    background:white;
    color:#334155;
    border:1px solid #cbd5e1;
}

.header-actions .button-secondary{
    background:rgba(255,255,255,.08);
    color:white;
    border-color:rgba(255,255,255,.2);
}

.container{
    max-width:1250px;
    margin:30px auto;
    padding:0 20px 50px;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:22px;
}

.page-title{
    margin:0;
    font-size:28px;
    color:#0f172a;
}

.page-subtitle{
    margin-top:7px;
    color:#64748b;
    font-size:14px;
}

.chantier-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(15,23,42,.06);
    margin-bottom:20px;
}

.chantier-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.chantier-name{
    font-size:22px;
    font-weight:800;
    color:#0f172a;
}

.chantier-info{
    color:#64748b;
    font-size:13px;
    margin-top:6px;
}

.badge{
    padding:7px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    background:#dcfce7;
    color:#166534;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:18px;
}

.stat{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:9px;
    padding:14px;
}

.stat-label{
    color:#64748b;
    font-size:11px;
}

.stat-value{
    margin-top:6px;
    font-size:19px;
    font-weight:800;
    color:#0f172a;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.card-title{
    margin:0;
    font-size:18px;
    color:#0f172a;
}

.card-subtitle{
    margin-top:4px;
    color:#94a3b8;
    font-size:11px;
}

.filters{
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr 1.5fr;
    gap:10px;
    margin-bottom:18px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:10px 11px;
    background:white;
    color:#172033;
    font-size:13px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#f28c28;
    box-shadow:0 0 0 3px rgba(242,140,40,.12);
}

.task-list{
    display:grid;
    gap:12px;
}

.task{
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:15px;
    background:#fff;
}

.task:hover{
    border-color:#cbd5e1;
}

.task-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.task-title{
    font-size:15px;
    font-weight:800;
    color:#0f172a;
}

.task-description{
    margin-top:5px;
    color:#64748b;
    font-size:12px;
    line-height:1.5;
}

.task-badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
}

.task-badge{
    padding:5px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:800;
}

.status-todo{
    background:#e2e8f0;
    color:#475569;
}

.status-progress{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-done{
    background:#dcfce7;
    color:#166534;
}

.status-late{
    background:#fee2e2;
    color:#991b1b;
}

.priority-high{
    background:#fee2e2;
    color:#991b1b;
}

.priority-medium{
    background:#fef3c7;
    color:#92400e;
}

.priority-low{
    background:#dcfce7;
    color:#166534;
}

.task-bottom{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #f1f5f9;
}

.task-info-label{
    color:#94a3b8;
    font-size:10px;
}

.task-info-value{
    color:#334155;
    font-size:12px;
    font-weight:700;
    margin-top:3px;
}

.task-progress{
    margin-top:12px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#64748b;
    margin-bottom:5px;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#e2e8f0;
    border-radius:99px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:#f28c28;
    border-radius:99px;
}

.task-actions{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:12px;
}

.small-button{
    border:1px solid #cbd5e1;
    background:white;
    color:#334155;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
}

.small-button:hover{
    background:#f8fafc;
}

.small-button.delete{
    color:#be123c;
    border-color:#fecdd3;
    background:#fff1f2;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#94a3b8;
    border:1px dashed #cbd5e1;
    border-radius:10px;
}

.empty-title{
    font-size:18px;
    font-weight:800;
    color:#334155;
    margin-bottom:7px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:min(750px,100%);
    max-height:90vh;
    overflow-y:auto;
    border-radius:14px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    margin:0;
    font-size:20px;
    color:#0f172a;
}

.close{
    border:none;
    background:#f1f5f9;
    width:34px;
    height:34px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:12px;
    font-weight:700;
    color:#334155;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.modules{
    background:#0f172a;
    border-radius:14px;
    padding:20px;
    margin-top:20px;
}

.modules h2{
    color:white;
    font-size:17px;
    margin:0 0 15px;
}

.module-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.module-link{
    text-decoration:none;
    color:#e2e8f0;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
    font-size:11px;
    font-weight:700;
}

.module-link:hover{
    background:#f28c28;
    border-color:#f28c28;
}

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    background:#0f172a;
    color:white;
    padding:13px 17px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:.25s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

footer{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    padding:20px;
}

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .module-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:750px){

    .page-header,
    .chantier-top{
        flex-direction:column;
    }

    .task-bottom{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .container{
        margin-top:20px;
        padding:0 14px 40px;
    }

    .stats,
    .filters{
        grid-template-columns:1fr;
    }

    .module-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:420px){

    .task-bottom,
    .module-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div>

            <div class="logo">
                BATI<span>FLOW</span>
            </div>

            <div class="header-title">
                Planning professionnel des chantiers BTP
            </div>

        </div>

        <div class="header-actions">

            <a
                href="suivi-chantier.html"
                class="button button-secondary"
                id="btnSuivi"
            >
                ← Suivi chantier
            </a>

            <a
                href="dashboard.html"
                class="button button-secondary"
            >
                Tableau de bord
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div id="application"></div>

</main>


<footer>
    BATIFLOW — Gestion BTP • V1.0
</footer>


<div
    class="toast"
    id="toast"
></div>


<!-- =====================================================
     MODAL TÂCHE
===================================================== -->

<div
    class="modal"
    id="taskModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                Nouvelle tâche
            </h2>

            <button
                class="close"
                onclick="fermerModal()"
            >
                ×
            </button>

        </div>


        <form
            id="taskForm"
        >

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Titre de la tâche *
                    </label>

                    <input
                        type="text"
                        id="taskTitre"
                        required
                        placeholder="Ex : Réalisation des fondations"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="Détails de la tâche..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Responsable
                    </label>

                    <input
                        type="text"
                        id="taskResponsable"
                        placeholder="Nom du responsable"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Priorité
                    </label>

                    <select id="taskPriorite">

                        <option value="Faible">
                            Faible
                        </option>

                        <option value="Moyenne" selected>
                            Moyenne
                        </option>

                        <option value="Haute">
                            Haute
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Date de début
                    </label>

                    <input
                        type="date"
                        id="taskDateDebut"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Date de fin
                    </label>

                    <input
                        type="date"
                        id="taskDateFin"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Statut
                    </label>

                    <select id="taskStatut">

                        <option value="À faire">
                            À faire
                        </option>

                        <option value="En cours">
                            En cours
                        </option>

                        <option value="Terminé">
                            Terminé
                        </option>

                        <option value="En retard">
                            En retard
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Avancement (%)
                    </label>

                    <input
                        type="number"
                        id="taskAvancement"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="button button-secondary"
                    onclick="fermerModal()"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    💾 Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const CHANTIERS_KEY =
    "batiflowChantiers";

const PLANNING_KEY =
    "batiflowPlanning";

let chantierActuel = null;

let taches = [];

let tacheEnEdition = null;


/* =====================================================
   STORAGE
===================================================== */

function lireStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


function sauvegarderStorage(
    key,
    data
){

    localStorage.setItem(
        key,
        JSON.stringify(data)
    );

}


/* =====================================================
   UTILITAIRES
===================================================== */

function echapper(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function clamp(value,min,max){

    return Math.min(
        max,
        Math.max(
            min,
            Number(value) || 0
        )
    );

}


function formatDate(date){

    if(!date){

        return "—";

    }

    const d =
        new Date(
            date + (
                String(date).includes("T")
                ? ""
                : "T00:00:00"
            )
        );

    if(isNaN(d.getTime())){

        return date;

    }

    return d.toLocaleDateString(
        "fr-FR"
    );

}


function afficherToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   ID CHANTIER
===================================================== */

function obtenirChantierId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlId =
        params.get(
            "chantierId"
        );

    if(urlId){

        return urlId;

    }


    const actif =
        localStorage.getItem(
            "batiflowChantierActif"
        );

    if(actif){

        return actif;

    }


    const selection =
        localStorage.getItem(
            "chantierSelectionne"
        );

    if(selection){

        try{

            const objet =
                JSON.parse(
                    selection
                );

            return objet?.id || null;

        }catch(error){

            return null;

        }

    }


    return null;

}


/* =====================================================
   CHARGER CHANTIER
===================================================== */

function chargerChantier(){

    const id =
        obtenirChantierId();

    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    if(id){

        chantierActuel =
            chantiers.find(
                chantier =>
                    String(
                        chantier.id
                    )
                    ===
                    String(id)
            );

    }


    if(
        chantierActuel
    ){

        localStorage.setItem(
            "batiflowChantierActif",
            String(
                chantierActuel.id
            )
        );

        localStorage.setItem(
            "chantierSelectionne",
            JSON.stringify(
                chantierActuel
            )
        );

    }

}


/* =====================================================
   CHARGER TÂCHES
===================================================== */

function chargerTaches(){

    const planning =
        lireStorage(
            PLANNING_KEY
        );


    if(!chantierActuel){

        taches = [];

        return;

    }


    taches =
        planning.filter(
            tache =>
                String(
                    tache.chantierId
                )
                ===
                String(
                    chantierActuel.id
                )
        );

}


/* =====================================================
   SAUVEGARDER TÂCHES
===================================================== */

function sauvegarderTaches(){

    if(!chantierActuel){

        return;

    }


    const planning =
        lireStorage(
            PLANNING_KEY
        );


    const autres =
        planning.filter(
            tache =>
                String(
                    tache.chantierId
                )
                !==
                String(
                    chantierActuel.id
                )
        );


    sauvegarderStorage(
        PLANNING_KEY,
        autres.concat(taches)
    );

}


/* =====================================================
   STATUT CSS
===================================================== */

function classeStatut(statut){

    switch(statut){

        case "En cours":
            return "status-progress";

        case "Terminé":
            return "status-done";

        case "En retard":
            return "status-late";

        default:
            return "status-todo";

    }

}


function classePriorite(priorite){

    switch(priorite){

        case "Haute":
            return "priority-high";

        case "Faible":
            return "priority-low";

        default:
            return "priority-medium";

    }

}


/* =====================================================
   AFFICHAGE
===================================================== */

function afficherApplication(){

    const app =
        document.getElementById(
            "application"
        );


    if(!chantierActuel){

        app.innerHTML = `

            <div class="card">

                <div class="empty">

                    <div class="empty-title">
                        Aucun chantier sélectionné
                    </div>

                    <p>
                        Ouvrez le planning depuis le
                        module Chantiers ou Suivi chantier.
                    </p>

                    <a
                        href="chantiers.html"
                        class="button button-primary"
                    >
                        ← Choisir un chantier
                    </a>

                </div>

            </div>

        `;

        return;

    }


    const total =
        taches.length;


    const terminees =
        taches.filter(
            tache =>
                tache.statut ===
                "Terminé"
        ).length;


    const enCours =
        taches.filter(
            tache =>
                tache.statut ===
                "En cours"
        ).length;


    const retard =
        taches.filter(
            tache =>
                tache.statut ===
                "En retard"
        ).length;


    app.innerHTML = `

        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Planning chantier
                </h1>

                <div class="page-subtitle">
                    Organisez et suivez les tâches de votre chantier.
                </div>

            </div>


            <button
                class="button button-primary"
                onclick="ouvrirNouvelleTache()"
            >
                ＋ Nouvelle tâche
            </button>

        </div>


        <section class="chantier-card">

            <div class="chantier-top">

                <div>

                    <div class="chantier-name">
                        ${echapper(
                            chantierActuel.nom
                        )}
                    </div>

                    <div class="chantier-info">

                        ${
                            chantierActuel.clientNom ||
                            chantierActuel.client
                            ? "Client : " +
                              echapper(
                                  chantierActuel.clientNom ||
                                  chantierActuel.client
                              )
                            : ""
                        }

                        ${
                            chantierActuel.localisation
                            ? " • 📍 " +
                              echapper(
                                  chantierActuel.localisation
                              )
                            : ""
                        }

                    </div>

                </div>


                <span class="badge">
                    ${echapper(
                        chantierActuel.statut ||
                        "En cours"
                    )}
                </span>

            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Total tâches
                    </div>

                    <div class="stat-value">
                        ${total}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        En cours
                    </div>

                    <div class="stat-value">
                        ${enCours}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Terminées
                    </div>

                    <div class="stat-value">
                        ${terminees}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        En retard
                    </div>

                    <div class="stat-value">
                        ${retard}
                    </div>

                </div>

            </div>

        </section>


        <section class="card">

            <div class="card-header">

                <div>

                    <h2 class="card-title">
                        Liste des tâches
                    </h2>

                    <div class="card-subtitle">
                        Planning opérationnel du chantier
                    </div>

                </div>

            </div>


            <div class="filters">

                <select id="filterStatut">

                    <option value="">
                        Tous les statuts
                    </option>

                    <option value="À faire">
                        À faire
                    </option>

                    <option value="En cours">
                        En cours
                    </option>

                    <option value="Terminé">
                        Terminé
                    </option>

                    <option value="En retard">
                        En retard
                    </option>

                </select>


                <select id="filterPriorite">

                    <option value="">
                        Toutes les priorités
                    </option>

                    <option value="Haute">
                        Haute
                    </option>

                    <option value="Moyenne">
                        Moyenne
                    </option>

                    <option value="Faible">
                        Faible
                    </option>

                </select>


                <select id="filterResponsable">

                    <option value="">
                        Tous les responsables
                    </option>

                </select>


                <input
                    type="search"
                    id="filterRecherche"
                    placeholder="Rechercher une tâche..."
                >

            </div>


            <div
                class="task-list"
                id="taskList"
            ></div>

        </section>


        <section class="modules">

            <h2>
                🔗 Modules du chantier
            </h2>

            <div class="module-grid">

                <a
                    href="chantiers.html"
                    class="module-link"
                >
                    🏗️ Chantiers
                </a>


                <a
                    href="#"
                    class="module-link"
                    onclick="ouvrirSuivi();return false;"
                >
                    📊 Suivi
                </a>


                <a
                    href="#"
                    class="module-link"
                    onclick="ouvrirCalendrier();return false;"
                >
                    🗓️ Calendrier
                </a>


                <a
                    href="#"
                    class="module-link"
                    onclick="ouvrirFinances();return false;"
                >
                    💰 Finances
                </a>


                <a
                    href="#"
                    class="module-link"
                    onclick="ouvrirPilotage();return false;"
                >
                    📈 Pilotage financier
                </a>

            </div>

        </section>

    `;


    remplirResponsables();

    afficherTaches();

    activerFiltres();

}


/* =====================================================
   RESPONSABLES
===================================================== */

function remplirResponsables(){

    const select =
        document.getElementById(
            "filterResponsable"
        );


    if(!select){

        return;

    }


    const responsables =
        [
            ...new Set(
                taches
                .map(
                    tache =>
                        tache.responsable
                )
                .filter(Boolean)
            )
        ];


    responsables.forEach(
        responsable => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                responsable;

            option.textContent =
                responsable;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   AFFICHER TÂCHES
===================================================== */

function afficherTaches(){

    const container =
        document.getElementById(
            "taskList"
        );


    if(!container){

        return;

    }


    const statut =
        document.getElementById(
            "filterStatut"
        )?.value || "";


    const priorite =
        document.getElementById(
            "filterPriorite"
        )?.value || "";


    const responsable =
        document.getElementById(
            "filterResponsable"
        )?.value || "";


    const recherche =
        (
            document.getElementById(
                "filterRecherche"
            )?.value || ""
        )
        .toLowerCase()
        .trim();


    const resultat =
        taches.filter(
            tache => {

                if(
                    statut &&
                    tache.statut !== statut
                ){

                    return false;

                }


                if(
                    priorite &&
                    tache.priorite !== priorite
                ){

                    return false;

                }


                if(
                    responsable &&
                    tache.responsable !== responsable
                ){

                    return false;

                }


                if(
                    recherche
                ){

                    const texte =
                        String(
                            tache.titre || ""
                        ) +
                        " " +
                        String(
                            tache.description || ""
                        ) +
                        " " +
                        String(
                            tache.responsable || ""
                        );


                    if(
                        !texte
                        .toLowerCase()
                        .includes(
                            recherche
                        )
                    ){

                        return false;

                    }

                }


                return true;

            }
        );


    if(!resultat.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    Aucune tâche
                </div>

                <div>
                    Aucune tâche ne correspond aux filtres actuels.
                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        resultat.map(
            tache => {

                const avancement =
                    clamp(
                        tache.avancement,
                        0,
                        100
                    );


                return `

                    <div class="task">

                        <div class="task-top">

                            <div>

                                <div class="task-title">
                                    ${echapper(
                                        tache.titre
                                    )}
                                </div>

                                ${
                                    tache.description
                                    ? `
                                        <div class="task-description">
                                            ${echapper(
                                                tache.description
                                            )}
                                        </div>
                                      `
                                    : ""
                                }


                                <div class="task-badges">

                                    <span
                                        class="task-badge ${classeStatut(
                                            tache.statut
                                        )}"
                                    >
                                        ${echapper(
                                            tache.statut
                                        )}
                                    </span>


                                    <span
                                        class="task-badge ${classePriorite(
                                            tache.priorite
                                        )}"
                                    >
                                        Priorité :
                                        ${echapper(
                                            tache.priorite
                                        )}
                                    </span>

                                </div>

                            </div>

                        </div>


                        <div class="task-bottom">

                            <div>

                                <div class="task-info-label">
                                    Responsable
                                </div>

                                <div class="task-info-value">
                                    ${
                                        echapper(
                                            tache.responsable
                                        ) || "Non défini"
                                    }
                                </div>

                            </div>


                            <div>

                                <div class="task-info-label">
                                    Début
                                </div>

                                <div class="task-info-value">
                                    ${formatDate(
                                        tache.dateDebut
                                    )}
                                </div>

                            </div>


                            <div>

                                <div class="task-info-label">
                                    Fin
                                </div>

                                <div class="task-info-value">
                                    ${formatDate(
                                        tache.dateFin
                                    )}
                                </div>

                            </div>


                            <div>

                                <div class="task-info-label">
                                    Avancement
                                </div>

                                <div class="task-info-value">
                                    ${avancement} %
                                </div>

                            </div>

                        </div>


                        <div class="task-progress">

                            <div class="progress-header">

                                <span>
                                    Progression
                                </span>

                                <strong>
                                    ${avancement} %
                                </strong>

                            </div>


                            <div class="progress-bar">

                                <div
                                    class="progress-fill"
                                    style="width:${avancement}%"
                                ></div>

                            </div>

                        </div>


                        <div class="task-actions">

                            <button
                                class="small-button"
                                onclick="modifierTache('${tache.id}')"
                            >
                                ✏️ Modifier
                            </button>


                            <button
                                class="small-button"
                                onclick="terminerTache('${tache.id}')"
                            >
                                ${
                                    tache.statut === "Terminé"
                                    ? "↩️ Réouvrir"
                                    : "✓ Terminer"
                                }
                            </button>


                            <button
                                class="small-button delete"
                                onclick="supprimerTache('${tache.id}')"
                            >
                                🗑️ Supprimer
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   FILTRES
===================================================== */

function activerFiltres(){

    [
        "filterStatut",
        "filterPriorite",
        "filterResponsable",
        "filterRecherche"
    ].forEach(
        id => {

            const element =
                document.getElementById(
                    id
                );

            if(element){

                element.addEventListener(
                    "input",
                    afficherTaches
                );

                element.addEventListener(
                    "change",
                    afficherTaches
                );

            }

        }
    );

}


/* =====================================================
   MODAL
===================================================== */

function ouvrirNouvelleTache(){

    tacheEnEdition =
        null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Nouvelle tâche";


    document.getElementById(
        "taskForm"
    ).reset();


    document.getElementById(
        "taskAvancement"
    ).value =
        0;


    document.getElementById(
        "taskModal"
    ).classList.add(
        "show"
    );

}


function fermerModal(){

    document.getElementById(
        "taskModal"
    ).classList.remove(
        "show"
    );

    tacheEnEdition =
        null;

}


/* =====================================================
   MODIFIER
===================================================== */

function modifierTache(id){

    const tache =
        taches.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(!tache){

        return;

    }


    tacheEnEdition =
        tache.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Modifier la tâche";


    document.getElementById(
        "taskTitre"
    ).value =
        tache.titre || "";


    document.getElementById(
        "taskDescription"
    ).value =
        tache.description || "";


    document.getElementById(
        "taskResponsable"
    ).value =
        tache.responsable || "";


    document.getElementById(
        "taskPriorite"
    ).value =
        tache.priorite || "Moyenne";


    document.getElementById(
        "taskDateDebut"
    ).value =
        tache.dateDebut || "";


    document.getElementById(
        "taskDateFin"
    ).value =
        tache.dateFin || "";


    document.getElementById(
        "taskStatut"
    ).value =
        tache.statut || "À faire";


    document.getElementById(
        "taskAvancement"
    ).value =
        clamp(
            tache.avancement,
            0,
            100
        );


    document.getElementById(
        "taskModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   FORMULAIRE
===================================================== */

document.getElementById(
    "taskForm"
).addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        if(!chantierActuel){

            afficherToast(
                "Aucun chantier sélectionné."
            );

            return;

        }


        const titre =
            document.getElementById(
                "taskTitre"
            ).value.trim();


        if(!titre){

            return;

        }


        const description =
            document.getElementById(
                "taskDescription"
            ).value.trim();


        const responsable =
            document.getElementById(
                "taskResponsable"
            ).value.trim();


        const priorite =
            document.getElementById(
                "taskPriorite"
            ).value;


        const dateDebut =
            document.getElementById(
                "taskDateDebut"
            ).value;


        const dateFin =
            document.getElementById(
                "taskDateFin"
            ).value;


        let statut =
            document.getElementById(
                "taskStatut"
            ).value;


        let avancement =
            clamp(
                document.getElementById(
                    "taskAvancement"
                ).value,
                0,
                100
            );


        if(avancement >= 100){

            statut =
                "Terminé";

        }


        const now =
            new Date().toISOString();


        if(tacheEnEdition){

            const index =
                taches.findIndex(
                    item =>
                        String(item.id)
                        ===
                        String(tacheEnEdition)
                );


            if(index !== -1){

                taches[index] = {

                    ...taches[index],

                    titre,
                    description,
                    responsable,
                    priorite,
                    dateDebut,
                    dateFin,
                    statut,
                    avancement,

                    updatedAt:
                        now

                };

            }


            afficherToast(
                "Tâche modifiée."
            );

        }else{

            taches.push({

                id:
                    "tache_" +
                    Date.now() +
                    "_" +
                    Math.random()
                    .toString(36)
                    .slice(2,7),

                chantierId:
                    chantierActuel.id,

                chantier:
                    chantierActuel.nom,

                titre,

                description,

                responsable,

                dateDebut,

                dateFin,

                statut,

                avancement,

                priorite,

                createdAt:
                    now,

                updatedAt:
                    now

            });


            afficherToast(
                "Nouvelle tâche ajoutée."
            );

        }


        sauvegarderTaches();

        fermerModal();

        afficherApplication();

    }
);


/* =====================================================
   TERMINER
===================================================== */

function terminerTache(id){

    const tache =
        taches.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(!tache){

        return;

    }


    if(
        tache.statut ===
        "Terminé"
    ){

        tache.statut =
            "À faire";

        tache.avancement =
            0;

    }else{

        tache.statut =
            "Terminé";

        tache.avancement =
            100;

    }


    tache.updatedAt =
        new Date().toISOString();


    sauvegarderTaches();

    afficherApplication();

}


/* =====================================================
   SUPPRIMER
===================================================== */

function supprimerTache(id){

    const index =
        taches.findIndex(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(index === -1){

        return;

    }


    if(
        !confirm(
            "Supprimer définitivement cette tâche ?"
        )
    ){

        return;

    }


    taches.splice(
        index,
        1
    );


    sauvegarderTaches();

    afficherApplication();

    afficherToast(
        "Tâche supprimée."
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function urlModule(page){

    if(!chantierActuel){

        return page;

    }


    return (
        page +
        "?chantierId=" +
        encodeURIComponent(
            chantierActuel.id
        )
    );

}


function ouvrirSuivi(){

    window.location.href =
        urlModule(
            "suivi-chantier.html"
        );

}


function ouvrirCalendrier(){

    window.location.href =
        urlModule(
            "calendrier.html"
        );

}


function ouvrirFinances(){

    window.location.href =
        urlModule(
            "finances.html"
        );

}


function ouvrirPilotage(){

    window.location.href =
        urlModule(
            "pilotage-financier.html"
        );

}


/* =====================================================
   FERMER MODAL EN CLIQUANT DEHORS
===================================================== */

document.getElementById(
    "taskModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            fermerModal();

        }

    }
);


/* =====================================================
   STORAGE
===================================================== */

window.addEventListener(
    "storage",
    function(){

        chargerChantier();

        chargerTaches();

        afficherApplication();

    }
);


/* =====================================================
   PAGESHOW
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        chargerChantier();

        chargerTaches();

        afficherApplication();

    }
);


/* =====================================================
   INITIALISATION
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        chargerChantier();

        chargerTaches();

        afficherApplication();

    }
);

</script>
