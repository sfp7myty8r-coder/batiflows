<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const CHANTIERS_KEY =
    "batiflowChantiers";

const FINANCES_KEY =
    "batiflowFinances";


let chantierActuel = null;

let operations = [];

let operationEnEdition = null;


/* =====================================================
   STORAGE
===================================================== */

function lireStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


function sauvegarderFinances(){

    localStorage.setItem(
        FINANCES_KEY,
        JSON.stringify(
            operations
        )
    );

}


/* =====================================================
   UTILITAIRES
===================================================== */

function echapper(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatMontant(value){

    return Number(
        value || 0
    ).toLocaleString(
        "fr-FR"
    ) + " FCFA";

}


function formatDate(date){

    if(!date){

        return "—";

    }

    const d =
        new Date(
            date + (
                String(date).includes("T")
                ? ""
                : "T00:00:00"
            )
        );

    if(isNaN(d.getTime())){

        return date;

    }

    return d.toLocaleDateString(
        "fr-FR"
    );

}


function aujourdHui(){

    const d =
        new Date();

    return [
        d.getFullYear(),
        String(
            d.getMonth()+1
        ).padStart(2,"0"),
        String(
            d.getDate()
        ).padStart(2,"0")
    ].join("-");

}


function afficherToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   CHANTIER ID
===================================================== */

function obtenirChantierId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlId =
        params.get(
            "chantierId"
        );

    if(urlId){

        return urlId;

    }


    const actif =
        localStorage.getItem(
            "batiflowChantierActif"
        );

    if(actif){

        return actif;

    }


    const selection =
        localStorage.getItem(
            "chantierSelectionne"
        );

    if(selection){

        try{

            const objet =
                JSON.parse(
                    selection
                );

            return objet?.id || null;

        }catch(error){

            return null;

        }

    }


    return null;

}


/* =====================================================
   CHARGER CHANTIER
===================================================== */

function chargerChantier(){

    const id =
        obtenirChantierId();


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    chantierActuel =
        chantiers.find(
            chantier =>
                String(
                    chantier.id
                )
                ===
                String(id)
        );


    if(chantierActuel){

        localStorage.setItem(
            "batiflowChantierActif",
            String(
                chantierActuel.id
            )
        );

        localStorage.setItem(
            "chantierSelectionne",
            JSON.stringify(
                chantierActuel
            )
        );

    }

}


/* =====================================================
   CHARGER FINANCES
===================================================== */

function chargerFinances(){

    const toutes =
        lireStorage(
            FINANCES_KEY
        );


    if(!chantierActuel){

        operations = [];

        return;

    }


    operations =
        toutes.filter(
            operation => {

                const id =
                    operation.chantierId ??
                    operation.projectId ??
                    operation.idChantier;


                return (
                    String(id)
                    ===
                    String(
                        chantierActuel.id
                    )
                );

            }
        );

}


/* =====================================================
   BUDGET
===================================================== */

function obtenirBudget(){

    if(!chantierActuel){

        return 0;

    }


    const champs = [
        "budget",
        "budgetPrevu",
        "budgetTotal",
        "budgetInitial",
        "montantBudget",
        "montantPrevisionnel"
    ];


    for(
        const champ of champs
    ){

        const valeur =
            Number(
                chantierActuel[
                    champ
                ]
            );


        if(
            Number.isFinite(
                valeur
            )
            &&
            valeur > 0
        ){

            return valeur;

        }

    }


    /*
     * Si aucun budget n'est présent
     * sur le chantier, on regarde
     * les devis enregistrés.
     */

    const devis =
        lireStorage(
            "batiflowDevis"
        );


    const devisChantier =
        devis.filter(
            d => {

                const id =
                    d.chantierId ??
                    d.projectId;


                return (
                    String(id)
                    ===
                    String(
                        chantierActuel.id
                    )
                );

            }
        );


    let totalDevis = 0;


    devisChantier.forEach(
        d => {

            const montant =
                Number(
                    d.totalTTC ??
                    d.totalHT ??
                    0
                );


            if(
                Number.isFinite(
                    montant
                )
            ){

                totalDevis +=
                    montant;

            }

        }
    );


    return totalDevis;

}


/* =====================================================
   CALCULS
===================================================== */

function calculerTotaux(){

    let depenses = 0;

    let recettes = 0;


    operations.forEach(
        operation => {

            const montant =
                Number(
                    operation.montant ??
                    operation.amount ??
                    operation.prix ??
                    operation.total ??
                    0
                );


            const type =
                String(
                    operation.type ||
                    operation.categoryType ||
                    ""
                ).toLowerCase();


            if(
                type === "recette" ||
                type === "revenue" ||
                type === "income"
            ){

                recettes +=
                    montant;

            }else{

                depenses +=
                    montant;

            }

        }
    );


    return {
        depenses,
        recettes,
        solde:
            recettes - depenses
    };

}

/* =====================================================
   TABLEAU
===================================================== */

function afficherTableau(){

    const container =
        document.getElementById(
            "tableauFinances"
        );


    if(!container){

        return;

    }


    const recherche =
        (
            document.getElementById(
                "searchFinance"
            )?.value
            || ""
        )
        .toLowerCase()
        .trim();


    const typeFiltre =
        document.getElementById(
            "filterType"
        )?.value
        || "";


    const categorieFiltre =
        document.getElementById(
            "filterCategory"
        )?.value
        || "";


    const liste =
        operations.filter(
            operation => {

                const type =
                    obtenirType(
                        operation
                    );


                const categorie =
                    String(
                        operation.categorie ||
                        operation.category ||
                        "Autre"
                    );


                const texte =
                    (
                        String(
                            operation.description ||
                            operation.libelle ||
                            operation.designation ||
                            ""
                        )
                        + " " +
                        categorie
                        + " " +
                        String(
                            operation.responsable ||
                            operation.auteur ||
                            ""
                        )
                        + " " +
                        String(
                            operation.reference ||
                            ""
                        )
                    )
                    .toLowerCase();


                if(
                    recherche &&
                    !texte.includes(
                        recherche
                    )
                ){

                    return false;

                }


                if(
                    typeFiltre &&
                    type !== typeFiltre
                ){

                    return false;

                }


                if(
                    categorieFiltre &&
                    categorie !==
                    categorieFiltre
                ){

                    return false;

                }


                return true;

            }
        )
        .sort(
            (a,b) => {

                const da =
                    new Date(
                        a.date ||
                        a.dateDepense ||
                        a.createdAt ||
                        0
                    );

                const db =
                    new Date(
                        b.date ||
                        b.dateDepense ||
                        b.createdAt ||
                        0
                    );

                return db - da;

            }
        );


    if(!liste.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    Aucune opération trouvée
                </div>

                <p>
                    Ajoutez une dépense ou une recette.
                </p>

                <button
                    class="button button-primary"
                    onclick="ouvrirModal()"
                >
                    + Nouvelle opération
                </button>

            </div>

        `;

        return;

    }


    let html = `

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            DATE
                        </th>

                        <th>
                            TYPE
                        </th>

                        <th>
                            CATÉGORIE
                        </th>

                        <th>
                            DESCRIPTION
                        </th>

                        <th>
                            RESPONSABLE
                        </th>

                        <th>
                            RÉFÉRENCE
                        </th>

                        <th>
                            MONTANT
                        </th>

                        <th>
                            ACTIONS
                        </th>

                    </tr>

                </thead>

                <tbody>

    `;


    liste.forEach(
        operation => {

            const type =
                obtenirType(
                    operation
                );


            const categorie =
                String(
                    operation.categorie ||
                    operation.category ||
                    "Autre"
                );


            const description =
                operation.description ||
                operation.libelle ||
                operation.designation ||
                "—";


            const responsable =
                operation.responsable ||
                operation.auteur ||
                operation.user ||
                "—";


            const reference =
                operation.reference ||
                operation.ref ||
                "—";


            const montant =
                Number(
                    operation.montant ??
                    operation.amount ??
                    operation.prix ??
                    operation.total ??
                    0
                );


            const date =
                operation.date ||
                operation.dateDepense ||
                operation.datePaiement ||
                operation.createdAt;


            const badgeClass =
                type === "recette"
                ? "type-recette"
                : "type-depense";


            const amountClass =
                type === "recette"
                ? "amount-recette"
                : "amount-depense";


            html += `

                <tr>

                    <td>
                        ${formatDate(
                            date
                        )}
                    </td>

                    <td>

                        <span
                            class="type-badge ${badgeClass}"
                        >
                            ${
                                type === "recette"
                                ? "RECETTE"
                                : "DÉPENSE"
                            }
                        </span>

                    </td>

                    <td class="category">
                        ${echapper(
                            categorie
                        )}
                    </td>

                    <td>
                        ${echapper(
                            description
                        )}
                    </td>

                    <td>
                        ${echapper(
                            responsable
                        )}
                    </td>

                    <td>
                        ${echapper(
                            reference
                        )}
                    </td>

                    <td class="${amountClass}">
                        ${formatMontant(
                            montant
                        )}
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="small-button button-success"
                                onclick="modifierOperation('${operation.id}')"
                            >
                                Modifier
                            </button>

                            <button
                                class="small-button button-danger"
                                onclick="supprimerOperation('${operation.id}')"
                            >
                                Supprimer
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    container.innerHTML =
        html;

}


/* =====================================================
   TYPE
===================================================== */

function obtenirType(
    operation
){

    const type =
        String(
            operation.type ||
            operation.categoryType ||
            ""
        ).toLowerCase();


    if(
        type === "recette" ||
        type === "revenue" ||
        type === "income"
    ){

        return "recette";

    }


    return "depense";

}

/* =====================================================
   ENREGISTRER OPÉRATION
===================================================== */

function enregistrerOperation(){

    if(!chantierActuel){

        afficherToast(
            "Aucun chantier sélectionné."
        );

        return;

    }


    const type =
        document.getElementById(
            "operationType"
        ).value;


    const date =
        document.getElementById(
            "operationDate"
        ).value;


    const categorie =
        document.getElementById(
            "operationCategory"
        ).value;


    const montant =
        Number(
            document.getElementById(
                "operationAmount"
            ).value
        );


    const description =
        document.getElementById(
            "operationDescription"
        ).value.trim();


    const responsable =
        document.getElementById(
            "operationResponsible"
        ).value.trim();


    const reference =
        document.getElementById(
            "operationReference"
        ).value.trim();


    const notes =
        document.getElementById(
            "operationNotes"
        ).value.trim();


    if(!date){

        afficherToast(
            "Veuillez sélectionner une date."
        );

        return;

    }


    if(
        !montant ||
        montant <= 0
    ){

        afficherToast(
            "Veuillez saisir un montant valide."
        );

        return;

    }


    if(!description){

        afficherToast(
            "Veuillez saisir une description."
        );

        return;

    }


    const toutes =
        lireStorage(
            FINANCES_KEY
        );


    if(operationEnEdition){

        const index =
            toutes.findIndex(
                operation =>
                    String(
                        operation.id
                    )
                    ===
                    String(
                        operationEnEdition
                    )
            );


        if(index !== -1){

            const ancienne =
                toutes[index];


            toutes[index] = {

                ...ancienne,

                type,

                date,

                categorie,

                category:
                    categorie,

                montant,

                amount:
                    montant,

                description,

                libelle:
                    description,

                responsable,

                reference,

                notes,

                chantierId:
                    chantierActuel.id,

                chantier:
                    chantierActuel.nom,

                chantierNom:
                    chantierActuel.nom,

                updatedAt:
                    new Date().toISOString()

            };

        }

    }else{

        const operation = {

            id:
                "fin_" +
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2,7),

            chantierId:
                chantierActuel.id,

            chantier:
                chantierActuel.nom,

            chantierNom:
                chantierActuel.nom,

            type,

            date,

            categorie,

            category:
                categorie,

            montant,

            amount:
                montant,

            description,

            libelle:
                description,

            responsable,

            reference,

            notes,

            createdAt:
                new Date().toISOString(),

            updatedAt:
                new Date().toISOString(),

            version:
                "BATIFLOW-FINANCES-V1"

        };


        toutes.push(
            operation
        );

    }


    localStorage.setItem(
        FINANCES_KEY,
        JSON.stringify(
            toutes
        )
    );


    chargerFinances();

    fermerModal();

    afficherApplication();

    afficherToast(
        operationEnEdition
        ? "Opération modifiée."
        : "Opération enregistrée."
    );

}

/* =====================================================
   SUPPRIMER
===================================================== */

function supprimerOperation(id){

    const operation =
        operations.find(
            item =>
                String(
                    item.id
                )
                ===
                String(id)
        );


    if(!operation){

        return;

    }


    const confirmation =
        confirm(
            "Supprimer cette opération financière ?"
        );


    if(!confirmation){

        return;

    }


    const toutes =
        lireStorage(
            FINANCES_KEY
        );


    const nouvelles =
        toutes.filter(
            item =>
                String(
                    item.id
                )
                !==
                String(id)
        );


    localStorage.setItem(
        FINANCES_KEY,
        JSON.stringify(
            nouvelles
        )
    );


    chargerFinances();

    afficherApplication();

    afficherToast(
        "Opération supprimée."
    );

}


/* =====================================================
   BUDGET CHANTIER
===================================================== */

function enregistrerBudget(){

    if(!chantierActuel){

        return;

    }


    const input =
        document.getElementById(
            "budgetInput"
        );


    const budget =
        Number(
            input.value
        );


    if(
        !budget ||
        budget < 0
    ){

        afficherToast(
            "Veuillez saisir un budget valide."
        );

        return;

    }


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    const index =
        chantiers.findIndex(
            chantier =>
                String(
                    chantier.id
                )
                ===
                String(
                    chantierActuel.id
                )
        );


    if(index === -1){

        return;

    }


    chantiers[index].budget =
        budget;

    chantiers[index].budgetPrevu =
        budget;

    chantiers[index].budgetTotal =
        budget;

    chantiers[index].updatedAt =
        new Date().toISOString();


    localStorage.setItem(
        CHANTIERS_KEY,
        JSON.stringify(
            chantiers
        )
    );


    chantierActuel =
        chantiers[index];


    localStorage.setItem(
        "batiflowChantierActif",
        String(
            chantierActuel.id
        )
    );


    localStorage.setItem(
        "chantierSelectionne",
        JSON.stringify(
            chantierActuel
        )
    );


    afficherApplication();

    afficherToast(
        "Budget enregistré."
    );

}
