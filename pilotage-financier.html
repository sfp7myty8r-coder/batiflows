<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BATIFLOW — Pilotage financier</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =====================================================
   HEADER
===================================================== */

header{
    background:#0f172a;
    color:white;
    padding:18px 25px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1300px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#f28c28;
}

.header-title{
    margin-top:4px;
    color:#cbd5e1;
    font-size:14px;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.button-primary{
    background:#f28c28;
    color:white;
}

.button-primary:hover{
    background:#d97706;
}

.button-secondary{
    background:rgba(255,255,255,.08);
    color:white;
    border:1px solid rgba(255,255,255,.2);
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1300px;
    margin:30px auto;
    padding:0 20px 50px;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:20px;
}

.page-title{
    margin:0;
    color:#0f172a;
    font-size:28px;
}

.page-subtitle{
    margin-top:7px;
    color:#64748b;
    font-size:14px;
}


/* =====================================================
   CHANTIER
===================================================== */

.chantier-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.chantier-name{
    font-size:20px;
    font-weight:800;
    color:#0f172a;
}

.chantier-info{
    margin-top:6px;
    color:#64748b;
    font-size:13px;
}


/* =====================================================
   KPI
===================================================== */

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(15,23,42,.05);
    position:relative;
    overflow:hidden;
}

.kpi::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#f28c28;
}

.kpi-blue::before{
    background:#2563eb;
}

.kpi-red::before{
    background:#dc2626;
}

.kpi-green::before{
    background:#16a34a;
}

.kpi-orange::before{
    background:#f28c28;
}

.kpi-purple::before{
    background:#7c3aed;
}

.kpi-label{
    color:#64748b;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.kpi-value{
    margin-top:9px;
    color:#0f172a;
    font-size:23px;
    font-weight:800;
}

.kpi-note{
    margin-top:5px;
    color:#94a3b8;
    font-size:10px;
}


/* =====================================================
   ALERT
===================================================== */

.alert{
    display:none;
    border-radius:12px;
    padding:15px 18px;
    margin-bottom:20px;
    font-size:13px;
    font-weight:700;
}

.alert.show{
    display:block;
}

.alert-warning{
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
}

.alert-danger{
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.alert-success{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    color:#166534;
}


/* =====================================================
   CARDS
===================================================== */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.card-title{
    margin:0;
    color:#0f172a;
    font-size:18px;
}

.card-subtitle{
    margin-top:5px;
    color:#94a3b8;
    font-size:11px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-section{
    margin-top:20px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:7px;
}

.progress-label{
    font-size:12px;
    font-weight:800;
    color:#334155;
}

.progress-percent{
    font-size:12px;
    font-weight:800;
    color:#f28c28;
}

.progress{
    width:100%;
    height:11px;
    background:#e2e8f0;
    border-radius:99px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    border-radius:99px;
    transition:.3s;
}

.progress-financial{
    background:#dc2626;
}

.progress-physical{
    background:#16a34a;
}


/* =====================================================
   COMPARAISON
===================================================== */

.comparison-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.comparison-box{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    background:#fafafa;
}

.comparison-title{
    font-size:13px;
    color:#64748b;
    font-weight:800;
}

.comparison-value{
    margin-top:8px;
    font-size:28px;
    font-weight:800;
    color:#0f172a;
}

.comparison-note{
    margin-top:5px;
    color:#94a3b8;
    font-size:11px;
}


/* =====================================================
   ECART
===================================================== */

.ecart-box{
    border-radius:14px;
    padding:20px;
    margin-top:20px;
    border:1px solid #e5e7eb;
}

.ecart-neutral{
    background:#f8fafc;
}

.ecart-positive{
    background:#f0fdf4;
    border-color:#bbf7d0;
}

.ecart-negative{
    background:#fef2f2;
    border-color:#fecaca;
}

.ecart-title{
    font-size:12px;
    font-weight:800;
    color:#64748b;
    text-transform:uppercase;
}

.ecart-value{
    margin-top:8px;
    font-size:28px;
    font-weight:800;
}

.ecart-description{
    margin-top:6px;
    color:#64748b;
    font-size:12px;
}


/* =====================================================
   TABLE
===================================================== */

.table-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.table-header{
    padding:18px 20px;
    border-bottom:1px solid #e5e7eb;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:750px;
    border-collapse:collapse;
}

thead{
    background:#0f172a;
    color:white;
}

th{
    padding:12px 10px;
    text-align:left;
    font-size:10px;
}

td{
    padding:12px 10px;
    border-bottom:1px solid #eef2f7;
    font-size:11px;
}

tbody tr:hover{
    background:#fffaf5;
}

.category-name{
    font-weight:700;
    color:#334155;
}

.category-amount{
    font-weight:800;
    color:#dc2626;
}

.category-percent{
    color:#64748b;
}


/* =====================================================
   FORM
===================================================== */

.form-inline{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.form-inline input{
    width:190px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.form-inline input:focus{
    border-color:#f28c28;
}


/* =====================================================
   MODULES
===================================================== */

.modules{
    background:#0f172a;
    border-radius:14px;
    padding:20px;
    margin-top:20px;
}

.modules-title{
    color:white;
    font-size:17px;
    font-weight:800;
    margin-bottom:15px;
}

.module-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

.module-link{
    text-decoration:none;
    color:#e2e8f0;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
    font-size:11px;
    font-weight:700;
}

.module-link:hover{
    background:#f28c28;
    border-color:#f28c28;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#94a3b8;
}

.empty-title{
    color:#334155;
    font-size:18px;
    font-weight:800;
    margin-bottom:7px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:2000;
    background:#0f172a;
    color:white;
    padding:13px 17px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px){

    .kpi-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .module-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .container{
        margin-top:20px;
        padding:0 14px 40px;
    }

    .page-header{
        flex-direction:column;
    }

    .kpi-grid{
        grid-template-columns:1fr;
    }

    .comparison-grid{
        grid-template-columns:1fr;
    }

    .module-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:430px){

    .module-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-inner">

        <div>

            <div class="logo">
                BATI<span>FLOW</span>
            </div>

            <div class="header-title">
                Pilotage financier du chantier
            </div>

        </div>


        <div class="header-actions">

            <a
                href="#"
                class="button button-secondary"
                onclick="ouvrirFinances();return false;"
            >
                ← Finances
            </a>

            <a
                href="dashboard.html"
                class="button button-secondary"
            >
                Tableau de bord
            </a>

        </div>

    </div>

</header>


<main class="container">

    <div id="application"></div>

</main>


<footer
    style="
        text-align:center;
        color:#94a3b8;
        font-size:12px;
        padding:20px;
    "
>
    BATIFLOW — Gestion BTP • V1.0
</footer>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const CHANTIERS_KEY =
    "batiflowChantiers";

const FINANCES_KEY =
    "batiflowFinances";

const SUIVIS_KEY =
    "batiflowSuivisChantiers";

const DEVIS_KEY =
    "batiflowDevis";


let chantierActuel = null;

let finances = [];

let suiviActuel = null;


/* =====================================================
   STORAGE
===================================================== */

function lireStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   UTILITAIRES
===================================================== */

function echapper(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombre(value){

    const n =
        Number(
            value
        );

    return Number.isFinite(n)
        ? n
        : 0;

}


function formatMontant(value){

    return nombre(
        value
    ).toLocaleString(
        "fr-FR"
    ) + " FCFA";

}


function clamp(
    value,
    min,
    max
){

    return Math.min(
        max,
        Math.max(
            min,
            nombre(value)
        )
    );

}


function afficherToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   CHANTIER ID
===================================================== */

function obtenirChantierId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlId =
        params.get(
            "chantierId"
        );


    if(urlId){

        return urlId;

    }


    const actif =
        localStorage.getItem(
            "batiflowChantierActif"
        );


    if(actif){

        return actif;

    }


    const selection =
        localStorage.getItem(
            "chantierSelectionne"
        );


    if(selection){

        try{

            const objet =
                JSON.parse(
                    selection
                );

            return objet?.id || null;

        }catch(error){

            return null;

        }

    }


    return null;

}


/* =====================================================
   CHARGER CHANTIER
===================================================== */

function chargerChantier(){

    const id =
        obtenirChantierId();


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    chantierActuel =
        chantiers.find(
            chantier =>
                String(
                    chantier.id
                )
                ===
                String(id)
        );


    if(chantierActuel){

        localStorage.setItem(
            "batiflowChantierActif",
            String(
                chantierActuel.id
            )
        );


        localStorage.setItem(
            "chantierSelectionne",
            JSON.stringify(
                chantierActuel
            )
        );

    }

}


/* =====================================================
   CHARGER FINANCES
===================================================== */

function chargerFinances(){

    const toutes =
        lireStorage(
            FINANCES_KEY
        );


    if(!chantierActuel){

        finances = [];

        return;

    }


    finances =
        toutes.filter(
            operation => {

                const id =
                    operation.chantierId ??
                    operation.projectId ??
                    operation.idChantier;


                return (
                    String(id)
                    ===
                    String(
                        chantierActuel.id
                    )
                );

            }
        );

}


/* =====================================================
   CHARGER SUIVI
===================================================== */

function chargerSuivi(){

    const suivis =
        lireStorage(
            SUIVIS_KEY
        );


    if(!chantierActuel){

        suiviActuel =
            null;

        return;

    }


    suiviActuel =
        suivis.find(
            suivi =>
                String(
                    suivi.chantierId
                )
                ===
                String(
                    chantierActuel.id
                )
        )
        || null;

}


/* =====================================================
   OBTENIR BUDGET
===================================================== */

function obtenirBudget(){

    if(!chantierActuel){

        return 0;

    }


    const champs = [

        "budget",

        "budgetPrevu",

        "budgetTotal",

        "budgetInitial",

        "montantBudget",

        "montantPrevisionnel"

    ];


    for(
        const champ of champs
    ){

        const valeur =
            nombre(
                chantierActuel[
                    champ
                ]
            );


        if(
            valeur > 0
        ){

            return valeur;

        }

    }


    /*
     * Si aucun budget n'est défini
     * dans le chantier, on cherche
     * le montant des devis associés.
     */

    const devis =
        lireStorage(
            DEVIs_KEY_CORRECTION()
        );


    return obtenirBudgetDepuisDevis(
        devis
    );

}


/* =====================================================
   CORRECTION / DEVIS
===================================================== */

function DEVIs_KEY_CORRECTION(){

    return DEVIs_STORAGE_KEY();

}


function DEVIs_STORAGE_KEY(){

    return DEVIs_KEY_INTERNE();

}


function DEVIs_KEY_INTERNE(){

    return DEVIs_KEY_FINAL();

}


function DEVIs_KEY_FINAL(){

    return DEVIs_KEY_SIMPLE();

}


function DEVIs_KEY_SIMPLE(){

    return DEVIs_KEY_VALUE();

}


function DEVIs_KEY_VALUE(){

    return "batiflowDevis";

}


/* =====================================================
   BUDGET DEPUIS DEVIS
===================================================== */

function obtenirBudgetDepuisDevis(
    devis
){

    if(!chantierActuel){

        return 0;

    }


    let total = 0;


    devis.forEach(
        devisItem => {

            const id =
                devisItem.chantierId ??
                devisItem.projectId;


            if(
                String(id)
                !==
                String(
                    chantierActuel.id
                )
            ){

                return;

            }


            const montant =
                nombre(
                    devisItem.totalTTC ??
                    devisItem.totalHT ??
                    devisItem.montant ??
                    0
                );


            total +=
                montant;

        }
    );


    return total;

}


/* =====================================================
   TYPE OPÉRATION
===================================================== */

function obtenirType(
    operation
){

    const type =
        String(
            operation.type ||
            operation.categoryType ||
            ""
        ).toLowerCase();


    if(
        type === "recette" ||
        type === "revenue" ||
        type === "income"
    ){

        return "recette";

    }


    return "depense";

}


/* =====================================================
   DÉPENSES
===================================================== */

function calculerDepenses(){

    let total = 0;


    finances.forEach(
        operation => {

            if(
                obtenirType(
                    operation
                )
                !==
                "depense"
            ){

                return;

            }


            total +=
                nombre(
                    operation.montant ??
                    operation.amount ??
                    operation.prix ??
                    operation.total ??
                    0
                );

        }
    );


    return total;

}


/* =====================================================
   RECETTES
===================================================== */

function calculerRecettes(){

    let total = 0;


    finances.forEach(
        operation => {

            if(
                obtenirType(
                    operation
                )
                !==
                "recette"
            ){

                return;

            }


            total +=
                nombre(
                    operation.montant ??
                    operation.amount ??
                    operation.prix ??
                    operation.total ??
                    0
                );

        }
    );


    return total;

}


/* =====================================================
   AVANCEMENT PHYSIQUE
===================================================== */

function obtenirAvancementPhysique(){

    /*
     * Priorité :
     * 1. suivi chantier
     * 2. chantier
     */

    if(suiviActuel){

        const valeurs = [

            suiviActuel.avancement,

            suiviActuel.progression,

            suiviActuel.pourcentage,

            suiviActuel.avancementPhysique

        ];


        for(
            const valeur of valeurs
        ){

            const n =
                nombre(
                    valeur
                );


            if(
                n >= 0
            ){

                return clamp(
                    n,
                    0,
                    100
                );

            }

        }

    }


    if(chantierActuel){

        const valeurs = [

            chantierActuel.avancement,

            chantierActuel.progression,

            chantierActuel.pourcentage,

            chantierActuel.avancementPhysique

        ];


        for(
            const valeur of valeurs
        ){

            const n =
                nombre(
                    valeur
                );


            if(
                n >= 0
            ){

                return clamp(
                    n,
                    0,
                    100
                );

            }

        }

    }


    return 0;

}


/* =====================================================
   CONSOMMATION FINANCIÈRE
===================================================== */

function calculerConsommation(
    budget,
    depenses
){

    if(
        budget <= 0
    ){

        return 0;

    }


    return (
        depenses /
        budget
    ) * 100;

}


/* =====================================================
   ÉCART FINANCIER
===================================================== */

function calculerEcart(
    avancementPhysique,
    consommationFinanciere
){

    /*
     * Écart =
     * avancement physique
     * - consommation financière
     *
     * Exemple :
     * physique 60%
     * financier 45%
     * écart +15 points
     */

    return (
        avancementPhysique -
        consommationFinanciere
    );

}


/* =====================================================
   RESTE À ENGAGER
===================================================== */

function calculerReste(
    budget,
    depenses
){

    return (
        budget -
        depenses
    );

}


/* =====================================================
   CLASSE ÉCART
===================================================== */

function classeEcart(
    ecart
){

    if(
        ecart > 5
    ){

        return "ecart-positive";

    }


    if(
        ecart < -5
    ){

        return "ecart-negative";

    }


    return "ecart-neutral";

}


/* =====================================================
   TEXTE ÉCART
===================================================== */

function texteEcart(
    ecart
){

    if(
        ecart > 5
    ){

        return "L'avancement physique est supérieur à la consommation financière.";

    }


    if(
        ecart < -5
    ){

        return "La consommation financière est supérieure à l'avancement physique.";

    }


    return "L'avancement physique et financier sont relativement proches.";

}


/* =====================================================
   AFFICHER APPLICATION
===================================================== */

function afficherApplication(){

    const app =
        document.getElementById(
            "application"

/* =====================================================
   ALERTES
===================================================== */

function afficherAlertes(
    budget,
    depenses,
    consommation,
    avancement,
    ecart
){

    const container =
        document.getElementById(
            "alertContainer"
        );


    if(!container){

        return;

    }


    let html = "";


    if(
        budget <= 0
    ){

        html += `

            <div class="alert alert-warning show">

                ⚠️
                Aucun budget prévu n'est défini pour ce chantier.
                Ajoutez un budget dans le module Finances.

            </div>

        `;

    }


    if(
        consommation > 100
    ){

        html += `

            <div class="alert alert-danger show">

                🚨
                Les dépenses réelles dépassent le budget prévu de
                ${formatMontant(
                    depenses - budget
                )}.

            </div>

        `;

    }


    if(
        ecart < -10
    ){

        html += `

            <div class="alert alert-danger show">

                ⚠️
                La consommation financière est supérieure de
                ${Math.abs(
                    ecart
                ).toFixed(1)}
                points à l'avancement physique.

            </div>

        `;

    }
    else if(
        ecart > 10
    ){

        html += `

            <div class="alert alert-success show">

                ✓
                L'avancement physique est supérieur de
                ${ecart.toFixed(1)}
                points à la consommation financière.

            </div>

        `;

    }


    container.innerHTML =
        html;

}


/* =====================================================
   DÉPENSES PAR CATÉGORIE
===================================================== */

function afficherCategories(
    totalDepenses
){

    const container =
        document.getElementById(
            "categoriesTable"
        );


    if(!container){

        return;

    }


    const categories = {};


    finances.forEach(
        operation => {

            if(
                obtenirType(
                    operation
                )
                !==
                "depense"
            ){

                return;

            }


            const categorie =
                operation.categorie ||
                operation.category ||
                "Autre";


            const montant =
                nombre(
                    operation.montant ??
                    operation.amount ??
                    operation.prix ??
                    operation.total ??
                    0
                );


            if(
                !categories[
                    categorie
                ]
            ){

                categories[
                    categorie
                ] = 0;

            }


            categories[
                categorie
            ] += montant;

        }
    );


    const liste =
        Object.entries(
            categories
        )
        .sort(
            (a,b) =>
                b[1] - a[1]
        );


    if(!liste.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    Aucune dépense enregistrée
                </div>

                Ajoutez des dépenses depuis le module Finances.

            </div>

        `;

        return;

    }


    let html = `

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            CATÉGORIE
                        </th>

                        <th>
                            MONTANT
                        </th>

                        <th>
                            PART DES DÉPENSES
                        </th>

                        <th>
                            PROPORTION
                        </th>

                    </tr>

                </thead>

                <tbody>

    `;


    liste.forEach(
        ([categorie,montant]) => {

            const pourcentage =
                totalDepenses > 0
                ? (
                    montant /
                    totalDepenses
                ) * 100
                : 0;


            html += `

                <tr>

                    <td class="category-name">
                        ${echapper(
                            categorie
                        )}
                    </td>

                    <td class="category-amount">
                        ${formatMontant(
                            montant
                        )}
                    </td>

                    <td class="category-percent">
                        ${pourcentage.toFixed(1)} %
                    </td>

                    <td>

                        <div class="progress">

                            <div
                                class="progress-fill progress-financial"
                                style="
                                    width:${pourcentage}%
                                "
                            ></div>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    container.innerHTML =
        html;

}
