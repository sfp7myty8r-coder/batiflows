
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion — BATIFLOW</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">

                <a href="index.html" class="logo">
                    BATI<span>FLOW</span>
                </a>

                <p>
                    La solution numérique pensée pour le BTP.
                </p>

            </div>


            <div class="auth-card">

                <div class="auth-header">

                    <h1>Bienvenue 👋</h1>

                    <p>
                        Connectez-vous à votre espace BATIFLOW.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Adresse e-mail
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="exemple@email.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Mot de passe
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Votre mot de passe"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Se connecter
                    </button>

                </form>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>


                <div class="auth-footer">

                    <p>
                        Vous n'avez pas encore de compte ?
                    </p>

                    <a href="register.html">
                        Créer un compte
                    </a>

                </div>


                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Retour à l'accueil
                </a>

            </div>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
