<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const CHANTIERS_KEY =
    "batiflowChantiers";

const PLANNING_KEY =
    "batiflowPlanning";


let chantierActuel = null;

let taches = [];

let dateCourante =
    new Date();


/* =====================================================
   STORAGE
===================================================== */

function lireStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   UTILITAIRES
===================================================== */

function echapper(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function clamp(value,min,max){

    return Math.min(
        max,
        Math.max(
            min,
            Number(value) || 0
        )
    );

}


function formatDate(date){

    if(!date){

        return "—";

    }

    const d =
        new Date(
            date + (
                String(date).includes("T")
                ? ""
                : "T00:00:00"
            )
        );

    if(isNaN(d.getTime())){

        return date;

    }

    return d.toLocaleDateString(
        "fr-FR"
    );

}


function formatMois(date){

    return date.toLocaleDateString(
        "fr-FR",
        {
            month:"long",
            year:"numeric"
        }
    );

}


function afficherToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   CHANTIER ID
===================================================== */

function obtenirChantierId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlId =
        params.get(
            "chantierId"
        );

    if(urlId){

        return urlId;

    }


    const actif =
        localStorage.getItem(
            "batiflowChantierActif"
        );

    if(actif){

        return actif;

    }


    const selection =
        localStorage.getItem(
            "chantierSelectionne"
        );

    if(selection){

        try{

            const objet =
                JSON.parse(
                    selection
                );

            return objet?.id || null;

        }catch(error){

            return null;

        }

    }


    return null;

}


/* =====================================================
   CHARGER CHANTIER
===================================================== */

function chargerChantier(){

    const id =
        obtenirChantierId();


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    if(id){

        chantierActuel =
            chantiers.find(
                chantier =>
                    String(
                        chantier.id
                    )
                    ===
                    String(id)
            );

    }


    if(chantierActuel){

        localStorage.setItem(
            "batiflowChantierActif",
            String(
                chantierActuel.id
            )
        );

        localStorage.setItem(
            "chantierSelectionne",
            JSON.stringify(
                chantierActuel
            )
        );

    }

}


/* =====================================================
   CHARGER PLANNING
===================================================== */

function chargerTaches(){

    const planning =
        lireStorage(
            PLANNING_KEY
        );


    if(!chantierActuel){

        taches =
            planning;

        return;

    }


    taches =
        planning.filter(
            tache =>
                String(
                    tache.chantierId
                )
                ===
                String(
                    chantierActuel.id
                )
        );

}


/* =====================================================
   DATE LOCALE
===================================================== */

function dateString(
    year,
    month,
    day
){

    const d =
        new Date(
            year,
            month,
            day
        );

    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth()+1
        ).padStart(
            2,
            "0"
        );

    const j =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${y}-${m}-${j}`;

}


/* =====================================================
   AUJOURD'HUI
===================================================== */

function estAujourdHui(
    date
){

    const today =
        new Date();

    return (
        date.getFullYear()
        ===
        today.getFullYear()
        &&
        date.getMonth()
        ===
        today.getMonth()
        &&
        date.getDate()
        ===
        today.getDate()
    );

}


/* =====================================================
   TÂCHES D'UN JOUR
===================================================== */

function tachesDuJour(
    date
){

    const cible =
        dateString(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );


    return taches.filter(
        tache => {

            if(
                !tache.dateDebut &&
                !tache.dateFin
            ){

                return false;

            }


            const debut =
                tache.dateDebut ||
                tache.dateFin;


            const fin =
                tache.dateFin ||
                tache.dateDebut;


            return (
                cible >= debut &&
                cible <= fin
            );

        }
    );

}

/* =====================================================
   CALENDRIER
===================================================== */

function afficherVueCalendrier(){

    const btnCalendrier =
        document.getElementById(
            "btnCalendrier"
        );

    const btnGantt =
        document.getElementById(
            "btnGantt"
        );


    if(btnCalendrier){

        btnCalendrier.classList.add(
            "active"
        );

    }


    if(btnGantt){

        btnGantt.classList.remove(
            "active"
        );

    }


    const container =
        document.getElementById(
            "vuePrincipale"
        );


    if(!container){

        return;

    }


    const year =
        dateCourante.getFullYear();

    const month =
        dateCourante.getMonth();


    const premier =
        new Date(
            year,
            month,
            1
        );


    const dernier =
        new Date(
            year,
            month + 1,
            0
        );


    /*
     * Lundi = 0
     */

    let jourDebut =
        premier.getDay();

    jourDebut =
        jourDebut === 0
        ? 6
        : jourDebut - 1;


    const joursMois =
        dernier.getDate();


    const dernierMoisPrecedent =
        new Date(
            year,
            month,
            0
        ).getDate();


    let html = `

        <section class="calendar-card">

            <div class="calendar-weekdays">

                <div class="weekday">
                    LUN
                </div>

                <div class="weekday">
                    MAR
                </div>

                <div class="weekday">
                    MER
                </div>

                <div class="weekday">
                    JEU
                </div>

                <div class="weekday">
                    VEN
                </div>

                <div class="weekday">
                    SAM
                </div>

                <div class="weekday">
                    DIM
                </div>

            </div>

            <div class="calendar-grid">
    `;


    /*
     * Jours du mois précédent
     */

    for(
        let i = jourDebut - 1;
        i >= 0;
        i--
    ){

        const day =
            dernierMoisPrecedent - i;


        const date =
            new Date(
                year,
                month - 1,
                day
            );


        html +=
            construireJour(
                date,
                true
            );

    }


    /*
     * Jours du mois actuel
     */

    for(
        let day = 1;
        day <= joursMois;
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );


        html +=
            construireJour(
                date,
                false
            );

    }


    /*
     * Jours du mois suivant
     */

    const totalCases =
        jourDebut +
        joursMois;


    const casesRestantes =
        totalCases % 7 === 0
        ? 0
        : 7 - (
            totalCases % 7
        );


    for(
        let day = 1;
        day <= casesRestantes;
        day++
    ){

        const date =
            new Date(
                year,
                month + 1,
                day
            );


        html +=
            construireJour(
                date,
                true
            );

    }


    html += `

            </div>

        </section>

    `;


    container.innerHTML =
        html;

}


function construireJour(
    date,
    autreMois
){

    const jourTaches =
        tachesDuJour(
            date
        );


    const today =
        estAujourdHui(
            date
        );


    let classes =
        "day";


    if(autreMois){

        classes +=
            " other-month";

    }


    if(today){

        classes +=
            " today";

    }


    let html = `

        <div
            class="${classes}"
            onclick="cliquerJour('${dateString(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            )}')"
        >

            <div class="day-number">
                ${date.getDate()}
            </div>

    `;


    const max =
        3;


    jourTaches
        .slice(0,max)
        .forEach(
            tache => {

                let taskClass =
                    "day-task";


                if(
                    tache.statut ===
                    "Terminé"
                ){

                    taskClass +=
                        " done";

                }


                if(
                    tache.statut ===
                    "En retard"
                ){

                    taskClass +=
                        " late";

                }


                html += `

                    <div
                        class="${taskClass}"
                        title="${echapper(
                            tache.titre
                        )}"
                        onclick="event.stopPropagation();ouvrirDetail('${tache.id}')"
                    >
                        ${echapper(
                            tache.titre
                        )}
                    </div>

                `;

            }
        );


    if(
        jourTaches.length > max
    ){

        html += `

            <div class="more-tasks">
                + ${
                    jourTaches.length - max
                } autre(s)
            </div>

        `;

    }


    html += `

        </div>

    `;


    return html;

}


/* =====================================================
   CLIQUER JOUR
===================================================== */

function cliquerJour(date){

    const jour =
        taches.filter(
            tache => {

                const debut =
                    tache.dateDebut ||
                    tache.dateFin;

                const fin =
                    tache.dateFin ||
                    tache.dateDebut;


                return (
                    date >= debut &&
                    date <= fin
                );

            }
        );


    if(
        jour.length === 1
    ){

        ouvrirDetail(
            jour[0].id
        );

    }

}


/* =====================================================
   GANTT
===================================================== */

function afficherVueGantt(){

    const btnCalendrier =
        document.getElementById(
            "btnCalendrier"
        );

    const btnGantt =
        document.getElementById(
            "btnGantt"
        );


    if(btnCalendrier){

        btnCalendrier.classList.remove(
            "active"
        );

    }


    if(btnGantt){

        btnGantt.classList.add(
            "active"
        );

    }


    const container =
        document.getElementById(
            "vuePrincipale"
        );


    if(!container){

        return;

    }


    if(!taches.length){

        container.innerHTML = `

            <section class="gantt-card">

                <div class="empty">

                    <div class="empty-title">
                        Aucun élément dans le Gantt
                    </div>

                    Ajoutez d'abord des tâches dans le Planning.

                </div>

            </section>

        `;

        return;

    }


    const dates =
        taches
        .flatMap(
            tache => [
                tache.dateDebut,
                tache.dateFin
            ]
        )
        .filter(Boolean)
        .sort();


    if(!dates.length){

        container.innerHTML = `

            <section class="gantt-card">

                <div class="empty">

                    <div class="empty-title">
                        Dates manquantes
                    </div>

                    Ajoutez des dates de début et de fin
                    aux tâches dans le Planning.

                </div>

            </section>

        `;

        return;

    }


    const debutGlobal =
        new Date(
            dates[0] +
            "T00:00:00"
        );


    const finGlobal =
        new Date(
            dates[dates.length - 1] +
            "T00:00:00"
        );


    const jours = [];


    let curseur =
        new Date(
            debutGlobal
        );


    while(
        curseur <= finGlobal
    ){

        jours.push(
            new Date(
                curseur
            )
        );


        curseur.setDate(
            curseur.getDate() + 1
        );

    }


    /*
     * Limiter l'affichage à 90 jours
     * pour garder le Gantt lisible.
     */

    if(jours.length > 90){

        jours.length = 90;

    }


    let html = `

        <section class="gantt-card">

            <h2 class="card-title">
                📊 Diagramme de Gantt
            </h2>

            <div class="card-subtitle">
                Du ${formatDate(
                    dates[0]
                )}
                au ${formatDate(
                    dates[dates.length - 1]
                )}
            </div>


            <div class="gantt-wrapper">

                <div class="gantt">

                    <div class="gantt-header">

                        <div class="gantt-label-header">
                            Tâche
                        </div>

                        <div
                            class="gantt-days"
                            style="
                                grid-template-columns:
                                repeat(${jours.length},1fr)
                            "
                        >
    `;


    jours.forEach(
        jour => {

            html += `

                <div class="gantt-day">

                    ${jour.getDate()}

                </div>

            `;

        }
    );


    html += `

                        </div>

                    </div>


                    <div class="gantt-body">

    `;


    taches.forEach(
        tache => {

            const debut =
                new Date(
                    (
                        tache.dateDebut ||
                        dates[0]
                    ) +
                    "T00:00:00"
                );


            const fin =
                new Date(
                    (
                        tache.dateFin ||
                        tache.dateDebut ||
                        dates[0]
                    ) +
                    "T00:00:00"
                );


            let indexDebut =
                differenceJours(
                    debutGlobal,
                    debut
                );


            let indexFin =
                differenceJours(
                    debutGlobal,
                    fin
                );


            indexDebut =
                Math.max(
                    0,
                    Math.min(
                        jours.length - 1,
                        indexDebut
                    )
                );


            indexFin =
                Math.max(
                    indexDebut,
                    Math.min(
                        jours.length - 1,
                        indexFin
                    )
                );


            const left =
                (
                    indexDebut /
                    jours.length
                ) * 100;


            const width =
                (
                    (
                        indexFin -
                        indexDebut +
                        1
                    )
                    /
                    jours.length
                ) * 100;


            let barClass =
                "";


            if(
                tache.statut ===
                "Terminé"
            ){

                barClass =
                    "done";

            }


            if(
                tache.statut ===
                "En retard"
            ){

                barClass =
                    "late";

            }


            html += `

                <div class="gantt-row">

                    <div
                        class="gantt-label"
                        onclick="ouvrirDetail('${tache.id}')"
                        style="cursor:pointer"
                    >

                        <div class="gantt-task-name">
                            ${echapper(
                                tache.titre
                            )}
                        </div>

                        <div class="gantt-responsable">
                            ${
                                echapper(
                                    tache.responsable
                                ) ||
                                "Responsable non défini"
                            }
                        </div>

                    </div>


                    <div class="gantt-timeline">

                        <div
                            class="gantt-bar ${barClass}"
                            style="
                                left:${left}%;
                                width:${width}%;
                            "
                            onclick="ouvrirDetail('${tache.id}')"
                            title="${echapper(
                                tache.titre
                            )}"
                        >

                            <div class="gantt-bar-label">
                                ${echapper(
                                    tache.titre
                                )}
                            </div>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    html += `

                    </div>

                </div>

            </div>

        </section>

    `;


    container.innerHTML =
        html;

}


function differenceJours(
    debut,
    fin
){

    const ms =
        24 *
        60 *
        60 *
        1000;


    return Math.round(
        (
            fin - debut
        ) / ms
    );

}
