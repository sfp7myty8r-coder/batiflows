/* ==========================================================
   BATIFLOW — DASHBOARD ÉTAPE 17
   CSS AUTONOME
========================================================== */

:root{
    --bf-dark:#101827;
    --bf-dark-2:#172033;
    --bf-orange:#f28c28;
    --bf-orange-dark:#e8790c;
    --bf-bg:#f5f7fb;
    --bf-card:#ffffff;
    --bf-border:#e7ebf2;
    --bf-text:#172033;
    --bf-muted:#718096;
    --bf-green:#16a34a;
    --bf-red:#dc2626;
    --bf-blue:#2563eb;
    --bf-purple:#7c3aed;
    --bf-shadow:0 8px 25px rgba(15,23,42,.06);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:var(--bf-bg);
    color:var(--bf-text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}


/* ==========================================================
   LAYOUT
========================================================== */

.dashboard-body{
    min-height:100vh;
    background:var(--bf-bg);
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:260px;
    background:var(--bf-dark);
    z-index:1000;
    overflow-y:auto;
    overflow-x:hidden;
    box-shadow:4px 0 20px rgba(0,0,0,.08);
}

.main-content{
    margin-left:260px;
    min-height:100vh;
    width:calc(100% - 260px);
}


/* ==========================================================
   LOGO
========================================================== */

.sidebar-header{
    height:92px;
    padding:20px 20px;
    display:flex;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo-batiflow{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-batiflow svg{
    width:42px;
    height:42px;
    flex-shrink:0;
}

.logo-text{
    line-height:1;
}

.logo-text-main{
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;
}

.logo-text-main .bati{
    color:#fff;
}

.logo-text-main .flow{
    color:var(--bf-orange);
}

.logo-subtitle{
    margin-top:5px;
    color:#94a3b8;
    font-size:7px;
    letter-spacing:1.7px;
}


/* ==========================================================
   SIDEBAR NAVIGATION
========================================================== */

.sidebar-nav{
    padding:15px 12px 25px;
}

.nav-link{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:45px;
    padding:11px 13px;
    margin-bottom:4px;
    color:#aeb8c8;
    border-radius:9px;
    font-size:14px;
    font-weight:500;
    transition:.2s ease;
}

.nav-link span:first-child{
    width:22px;
    text-align:center;
    font-size:16px;
    flex-shrink:0;
}

.nav-link:hover{
    background:rgba(255,255,255,.07);
    color:#fff;
}

.nav-link.active{
    background:var(--bf-orange);
    color:#fff;
    font-weight:700;
    box-shadow:0 5px 15px rgba(242,140,40,.18);
}

.nav-separator{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:13px 5px;
}
