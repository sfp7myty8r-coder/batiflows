<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte — BATIFLOW</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #101827;

}

    max-width: 450px;
}

    color: white;

    margin: 0 0 8px;

.subtitle {

label {
    display: block;

    border-color: #f28c28;

button {

}

.success {
    display: block;

.error {
    display: block;

    text-align: center;

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        BATI<span>FLOW</span>
    </div>

    <div class="card">

        <h1>Créer votre compte</h1>

        <div class="subtitle">
            Commencez votre essai gratuit de 3 jours
        </div>

        <form id="registerForm">

            <label for="registerName">
                Nom complet
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Ex : Maruis Lare"
                required
            >

            <label for="registerEmail">
                Adresse e-mail
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="exemple@email.com"
                required
            >

            <label for="registerPassword">
                Mot de passe
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 caractères"
                minlength="6"
                required
            >

            <label for="registerPasswordConfirm">
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                id="registerPasswordConfirm"
                placeholder="Répétez le mot de passe"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Créer mon compte
            </button>

        </form>

        <div id="registerMessage" class="message"></div>

        <div class="login-link">
            Vous avez déjà un compte ?
            <a href="login.html">Se connecter</a>
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://bwimievqpgaifjwbzayb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_D6v3wBJQVQypsPNyRZPfsA_PVQ_u-PX";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
   ========================================================= */

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("registerMessage");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================================
   INSCRIPTION
   ========================================================= */

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("registerName")
        .value
        .trim();

    const email =
        document.getElementById("registerEmail")
        .value
        .trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    const passwordConfirm =
        document.getElementById("registerPasswordConfirm")
        .value;


    /* Vérification nom */

    if (!name) {

        showMessage(
            "Veuillez entrer votre nom.",
            "error"
        );

        return;
    }


    /* Vérification mot de passe */

    if (password.length < 6) {

        showMessage(
            "Le mot de passe doit contenir au moins 6 caractères.",
            "error"
        );

        return;
    }


    /* Confirmation */

    if (password !== passwordConfirm) {

        showMessage(
            "Les mots de passe ne correspondent pas.",
            "error"
        );

        return;
    }


    registerButton.disabled = true;

    registerButton.textContent =
        "Création du compte...";


    try {

        console.log("BATIFLOW : début inscription");

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        full_name: name
                    },

                    emailRedirectTo:
                        window.location.origin +
                        "/login.html"
                }

            });


        console.log(
            "Réponse Supabase :",
            data
        );


        if (error) {

            console.error(
                "ERREUR SUPABASE :",
                error
            );

            showMessage(
                "Erreur Supabase : " +
                error.message,
                "error"
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "Créer mon compte";

            return;
        }


        /* =================================================
           COMPTE CRÉÉ
           ================================================= */

        console.log(
            "Compte BATIFLOW créé avec succès."
        );


        showMessage(
            "Compte créé avec succès ! Vérifiez votre adresse e-mail si une confirmation est demandée.",
            "success"
        );


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 2500);


    } catch (error) {

        console.error(
            "ERREUR JAVASCRIPT :",
            error
        );

        showMessage(
            "Erreur technique : " +
            error.message,
            "error"
        );

        registerButton.disabled = false;

        registerButton.textContent =
            "Créer mon compte";
    }

});

</script>

</body>
</html>
