<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matériaux & Stocks — BATIFLOW</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#172033;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    background:#101827;
    color:white;
    overflow-y:auto;
    z-index:1000;
}

.logo{
    height:80px;
    display:flex;
    align-items:center;
    padding:0 24px;
    font-size:24px;
    font-weight:800;
    letter-spacing:.5px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo span{
    color:#f28c28;
}

.logo small{
    display:block;
    font-size:10px;
    color:#94a3b8;
    margin-left:8px;
    margin-top:14px;
    font-weight:500;
}

.menu{
    padding:18px 12px;
}

.menu-title{
    font-size:11px;
    text-transform:uppercase;
    color:#64748b;
    padding:12px;
    font-weight:bold;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    margin-bottom:4px;
    color:#cbd5e1;
    text-decoration:none;
    border-radius:9px;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#182438;
    color:white;
}

.menu a.active{
    background:#f28c28;
    color:white;
    font-weight:bold;
}

.menu-icon{
    width:20px;
    text-align:center;
    font-size:17px;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:260px;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:500;
}

.topbar-title{
    font-size:20px;
    font-weight:700;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-badge{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f28c28;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.content{
    padding:28px;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.page-title h1{
    margin:0 0 7px;
    font-size:28px;
}

.page-title p{
    margin:0;
    color:#64748b;
    font-size:14px;
}

.primary-btn{
    border:0;
    background:#f28c28;
    color:white;
    padding:13px 18px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.primary-btn:hover{
    background:#df7818;
}
