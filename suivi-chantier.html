<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const CHANTIERS_KEY =
    "batiflowChantiers";

const SUIVIS_KEY =
    "batiflowSuivisChantiers";

const PLANNING_KEY =
    "batiflowPlanning";


let chantierActuel = null;

let suiviActuel = null;


/* =====================================================
   LOCAL STORAGE
===================================================== */

function lireStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        console.error(
            "Erreur localStorage:",
            error
        );

        return [];

    }

}


function sauvegarderStorage(
    key,
    data
){

    localStorage.setItem(
        key,
        JSON.stringify(data)
    );

}


/* =====================================================
   UTILITAIRES
===================================================== */

function echapper(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(date){

    if(!date){

        return "—";

    }

    const d =
        new Date(
            date + (
                String(date).includes("T")
                ? ""
                : "T00:00:00"
            )
        );

    if(isNaN(d.getTime())){

        return date;

    }

    return d.toLocaleDateString(
        "fr-FR"
    );

}


function formatDateTime(date){

    if(!date){

        return "—";

    }

    const d =
        new Date(date);

    if(isNaN(d.getTime())){

        return date;

    }

    return d.toLocaleDateString(
        "fr-FR"
    ) +
    " à " +
    d.toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function clamp(value,min,max){

    return Math.min(
        max,
        Math.max(
            min,
            Number(value) || 0
        )
    );

}


function afficherToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   RÉCUPÉRER L'ID DU CHANTIER
===================================================== */

function obtenirChantierId(){

    /*
     * Priorité 1 :
     * URL ?chantierId=...
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlId =
        params.get(
            "chantierId"
        );


    if(urlId){

        return urlId;

    }


    /*
     * Priorité 2 :
     * batiflowChantierActif
     */

    const actif =
        localStorage.getItem(
            "batiflowChantierActif"
        );


    if(actif){

        return actif;

    }


    /*
     * Priorité 3 :
     * chantierSelectionne
     */

    const selection =
        localStorage.getItem(
            "chantierSelectionne"
        );


    if(selection){

        try{

            const chantier =
                JSON.parse(
                    selection
                );

            return chantier?.id || null;

        }catch(error){

            return null;

        }

    }


    return null;

}


/* =====================================================
   CHANTIER
===================================================== */

function chargerChantier(){

    const id =
        obtenirChantierId();


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    if(id){

        chantierActuel =
            chantiers.find(
                chantier =>
                    String(
                        chantier.id
                    )
                    ===
                    String(id)
            );

    }


    /*
     * Si aucun ID n'est fourni,
     * on peut récupérer l'ancien
     * chantierSelectionne.
     */

    if(
        !chantierActuel
    ){

        const selection =
            localStorage.getItem(
                "chantierSelectionne"
            );


        if(selection){

            try{

                const ancien =
                    JSON.parse(
                        selection
                    );


                chantierActuel =
                    chantiers.find(
                        chantier =>
                            String(
                                chantier.id
                            )
                            ===
                            String(
                                ancien?.id
                            )
                    );

            }catch(error){

                chantierActuel =
                    null;

            }

        }

    }


    if(
        chantierActuel
    ){

        /*
         * Synchronisation du chantier actif
         */

        localStorage.setItem(
            "batiflowChantierActif",
            String(
                chantierActuel.id
            )
        );


        localStorage.setItem(
            "chantierSelectionne",
            JSON.stringify(
                chantierActuel
            )
        );

    }


    return chantierActuel;

}


/* =====================================================
   SUIVI
===================================================== */

function creerSuiviSiNecessaire(){

    if(!chantierActuel){

        return null;

    }


    const suivis =
        lireStorage(
            SUIVIS_KEY
        );


    let suivi =
        suivis.find(
            item =>
                String(
                    item.chantierId
                )
                ===
                String(
                    chantierActuel.id
                )
        );


    if(!suivi){

        suivi = {

            chantierId:
                chantierActuel.id,

            responsable:
                "",

            etapeActuelle:
                "Préparation",

            retardJours:
                0,

            avancement:
                Number(
                    chantierActuel.avancement
                ) || 0,

            taches:
                [],

            journal:
                [],

            problemes:
                [],

            photos:
                [],

            updatedAt:
                new Date().toISOString()

        };


        suivis.push(
            suivi
        );


        sauvegarderStorage(
            SUIVIS_KEY,
            suivis
        );

    }


    /*
     * Compatibilité avec d'anciens suivis
     */

    suivi.taches =
        Array.isArray(
            suivi.taches
        )
        ? suivi.taches
        : [];


    suivi.journal =
        Array.isArray(
            suivi.journal
        )
        ? suivi.journal
        : [];


    suivi.problemes =
        Array.isArray(
            suivi.problemes
        )
        ? suivi.problemes
        : [];


    suivi.photos =
        Array.isArray(
            suivi.photos
        )
        ? suivi.photos
        : [];


    if(
        suivi.avancement === undefined
    ){

        suivi.avancement =
            Number(
                chantierActuel.avancement
            ) || 0;

    }


    suiviActuel =
        suivi;


    return suivi;

}


/* =====================================================
   SAUVEGARDE SUIVI
===================================================== */

function sauvegarderSuivi(){

    if(
        !chantierActuel ||
        !suiviActuel
    ){

        return;

    }


    suiviActuel.updatedAt =
        new Date().toISOString();


    const suivis =
        lireStorage(
            SUIVIS_KEY
        );


    const index =
        suivis.findIndex(
            item =>
                String(
                    item.chantierId
                )
                ===
                String(
                    chantierActuel.id
                )
        );


    if(index === -1){

        suivis.push(
            suiviActuel
        );

    }else{

        suivis[index] =
            suiviActuel;

    }


    sauvegarderStorage(
        SUIVIS_KEY,
        suivis
    );

}


/* =====================================================
   SYNCHRONISER AVANCEMENT AVEC CHANTIER
===================================================== */

function synchroniserChantier(){

    if(
        !chantierActuel ||
        !suiviActuel
    ){

        return;

    }


    const chantiers =
        lireStorage(
            CHANTIERS_KEY
        );


    const index =
        chantiers.findIndex(
            chantier =>
                String(
                    chantier.id
                )
                ===
                String(
                    chantierActuel.id
                )
        );


    if(index === -1){

        return;

    }


    const avancement =
        clamp(
            suiviActuel.avancement,
            0,
            100
        );


    chantiers[index].avancement =
        avancement;


    /*
     * Si l'avancement atteint 100 %,
     * le chantier peut être marqué
     * terminé automatiquement.
     */

    if(
        avancement >= 100 &&
        chantiers[index].statut ===
        "En cours"
    ){

        chantiers[index].statut =
            "Terminé";

    }


    chantiers[index].updatedAt =
        new Date().toISOString();


    chantierActuel =
        chantiers[index];


    sauvegarderStorage(
        CHANTIERS_KEY,
        chantiers
    );


    localStorage.setItem(
        "chantierSelectionne",
        JSON.stringify(
            chantierActuel
        )
    );

}


/* =====================================================
   STATUT
===================================================== */

function classeStatut(statut){

    switch(statut){

        case "En cours":
            return "status-en-cours";

        case "Terminé":
            return "status-termine";

        case "En attente":
            return "status-en-attente";

        case "Suspendu":
            return "status-suspendu";

        default:
            return "status-autre";

    }

}

function enregistrerPilotage(){

        ).value.trim();


    const etape =

        clamp(

            100

        Number(
            document.getElementById(
                "retardJours"
            ).value
        ) || 0;


    const notes =
        document.getElementById(
            "notesSuivi"
        ).value.trim();


    suiviActuel.responsable =
        responsable;


    suiviActuel.etapeActuelle =
        etape;


    suiviActuel.avancement =
        avancement;


    suiviActuel.retardJours =
        retard;


    suiviActuel.notes =
        notes;


    sauvegarderSuivi();

    synchroniserChantier();


    afficherApplication();

    afficherToast(
        "Suivi du chantier enregistré."
    );

}

function afficherTaches(){

    const container =
        document.getElementById(
            "taskList"
        );


    if(!container){

        return;

    }


    const taches =
        suiviActuel?.taches || [];


    if(!taches.length){

        container.innerHTML = `

            <div class="empty-list">
                Aucune tâche enregistrée.
            </div>

        `;

        return;

    }


    container.innerHTML =
        taches.map(
            (tache,index) => `

                <div
                    class="task-item ${
                        tache.terminee
                        ? "done"
                        : ""
                    }"
                >

                    <input
                        class="task-check"
                        type="checkbox"
                        ${
                            tache.terminee
                            ? "checked"
                            : ""
                        }
                        onchange="changerEtatTache(${index})"
                    >


                    <div class="task-text">
                        ${echapper(
                            tache.titre ||
                            tache.nom ||
                            "Tâche"
                        )}
                    </div>


                    <button
                        class="delete-small"
                        onclick="supprimerTache(${index})"
                    >
                        ✕
                    </button>

                </div>

            `
        ).join("");

}


function ajouterTache(){

    if(!suiviActuel){

        return;

    }


    const input =
        document.getElementById(
            "nouvelleTache"
        );


    const texte =
        input.value.trim();


    if(!texte){

        return;

    }


    suiviActuel.taches.push({

        id:
            "tache_" +
            Date.now(),

        titre:
            texte,

        terminee:
            false,

        createdAt:
            new Date().toISOString()

    });


    input.value = "";


    sauvegarderSuivi();

    afficherTaches();

    afficherToast(
        "Tâche ajoutée."
    );

}


function changerEtatTache(index){

    if(
        !suiviActuel ||
        !suiviActuel.taches[index]
    ){

        return;

    }


    suiviActuel.taches[index].terminee =
        !suiviActuel.taches[index].terminee;


    suiviActuel.taches[index].updatedAt =
        new Date().toISOString();


    sauvegarderSuivi();

    afficherTaches();

}


function supprimerTache(index){

    if(
        !suiviActuel ||
        !suiviActuel.taches[index]
    ){

        return;

    }


    if(
        !confirm(
            "Supprimer cette tâche ?"
        )
    ){

        return;

    }


    suiviActuel.taches.splice(
        index,
        1
    );


    sauvegarderSuivi();

    afficherTaches();

}
