<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chantiers - BATIFLOW</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

.header{
    background:#0f172a;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#f59e0b;
}

.header a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:1200px;
    margin:35px auto;
    padding:0 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.top h1{
    margin:0 0 5px;
}

.top p{
    margin:0;
    color:#6b7280;
}

.primary-button{
    border:none;
    background:#f59e0b;
    color:#111827;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.primary-button:hover{
    background:#d97706;
    color:white;
}

.empty{
    background:white;
    border-radius:12px;
    padding:60px 20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#6b7280;
    margin-bottom:20px;
}

/* LISTE */

.chantiers-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.chantier-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.chantier-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.chantier-header h3{
    margin:0 0 5px;
    font-size:19px;
}

.chantier-client{
    color:#6b7280;
    font-size:13px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status.a-demarrer{
    background:#fef3c7;
    color:#92400e;
}

.status.en-cours{
    background:#dcfce7;
    color:#166534;
}

.status.pause{
    background:#fee2e2;
    color:#991b1b;
}

.status.termine{
    background:#dbeafe;
    color:#1e40af;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0;
}

.info{
    background:#f8fafc;
    padding:12px;
    border-radius:8px;
}

.info small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.info strong{
    font-size:14px;
}

.progress-area{
    margin-top:15px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:6px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#f59e0b;
    border-radius:20px;
}

.card-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.action-button{
    flex:1;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    border:1px solid #d1d5db;
    background:white;
}

.action-button.edit:hover{
    background:#fef3c7;
}

.action-button.delete{
    color:#b91c1c;
}

.action-button.delete:hover{
    background:#fee2e2;
}

/* MODALE */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:14px;
    padding:30px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-header h2{
    margin:0;
}

.close{
    border:none;
    background:transparent;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:25px;
}

.secondary-button{
    border:1px solid #d1d5db;
    background:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
}

.submit-button{
    border:none;
    background:#0f172a;
    color:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:800px){
    .chantiers-list{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){
    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .header{
        padding:16px 18px;
    }

    .container{
        padding:0 14px;
    }
}
</style>

</head>

<body>

<header class="header">

<a href="dashboard.html">

<main class="container">

```
<div class="top">

    <div>
        <h1>Mes chantiers</h1>
        <p>Gérez et suivez vos projets de construction.</p>
    </div>

    <button
        type="button"
        class="primary-button"
        id="nouveauChantierBtn">
        + Nouveau chantier
    </button>

</div>

<section id="emptyState" class="empty">

    <h2>🏗️ Aucun chantier</h2>

    <p>
        Commencez par créer votre premier chantier.
    </p>

    <button
        type="button"
        class="primary-button"
        id="emptyButton">
        + Créer un chantier
    </button>

</section>

<section
    id="chantiersList"
    class="chantiers-list"
    style="display:none;">
</section>
```

</main>

<!-- MODALE -->

<div class="modal" id="chantierModal">

```
<div class="modal-content">

    <div class="modal-header">

        <h2 id="modalTitle">
            Nouveau chantier
        </h2>

        <button
            type="button"
            class="close"
            id="closeModal">
            ×
        </button>

    </div>

    <form id="chantierForm">

        <div class="form-grid">

            <div class="form-group full">

                <label for="nom">
                    Nom du chantier *
                </label>

                <input
                    type="text"
                    id="nom"
                    placeholder="Ex : Construction maison R+1"
                    required>

            </div>

            <div class="form-group">

                <label for="client">
                    Client *
                </label>

                <input
                    type="text"
                    id="client"
                    placeholder="Nom du client"
                    required>

            </div>

            <div class="form-group">

                <label for="localisation">
                    Localisation *
                </label>

                <input
                    type="text"
                    id="localisation"
                    placeholder="Ex : Lomé, Agoè"
                    required>

            </div>

            <div class="form-group">

                <label for="dateDebut">
                    Date de début
                </label>

                <input
                    type="date"
                    id="dateDebut">

            </div>

            <div class="form-group">

                <label for="dateFin">
                    Fin prévue
                </label>

                <input
                    type="date"
                    id="dateFin">

            </div>

            <div class="form-group">

                <label for="budget">
                    Budget (FCFA)
                </label>

                <input
                    type="number"
                    id="budget"
                    min="0"
                    placeholder="Ex : 15000000">

            </div>

            <div class="form-group">

                <label for="avancement">
                    Avancement (%)
                </label>

                <input
                    type="number"
                    id="avancement"
                    min="0"
                    max="100"
                    value="0">

            </div>

            <div class="form-group">

                <label for="statut">
                    Statut
                </label>

                <select id="statut">

                    <option value="a-demarrer">
                        À démarrer
                    </option>

                    <option value="en-cours">
                        En cours
                    </option>

                    <option value="pause">
                        En pause
                    </option>

                    <option value="termine">
                        Terminé
                    </option>

                </select>

            </div>

            <div class="form-group full">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Informations complémentaires..."></textarea>

            </div>

        </div>

        <div class="form-actions">

            <button
                type="button"
                class="secondary-button"
                id="cancelButton">
                Annuler
            </button>

            <button
                type="submit"
                class="submit-button">
                Enregistrer le chantier
            </button>

        </div>

    </form>

</div>
```

</div>

<script>

const STORAGE_KEY = "batiflowChantiers";

let chantierEnModification = null;


/* ===============================
   ELEMENTS
================================ */

const nouveauBtn =
    document.getElementById("nouveauChantierBtn");

const emptyBtn =
    document.getElementById("emptyButton");

const modal =
    document.getElementById("chantierModal");

const closeBtn =
    document.getElementById("closeModal");

const cancelBtn =
    document.getElementById("cancelButton");

const formulaire =
    document.getElementById("chantierForm");

const liste =
    document.getElementById("chantiersList");

const emptyState =
    document.getElementById("emptyState");

const modalTitle =
    document.getElementById("modalTitle");


/* ===============================
   STOCKAGE
================================ */

function obtenirChantiers(){

    try{

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    }catch(error){

        return [];

    }

}


function sauvegarderChantiers(chantiers){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chantiers)
    );

}


/* ===============================
   MODALE
================================ */

function ouvrirChantier(){

    chantierEnModification = null;

    modalTitle.textContent =
        "Nouveau chantier";

    formulaire.reset();

    document.getElementById("avancement").value = 0;

    modal.classList.add("active");

}


function fermerChantier(){

    modal.classList.remove("active");

    chantierEnModification = null;

}


/* ===============================
   FORMATAGE
================================ */

function formaterMontant(montant){

    if(!montant) return "Non défini";

    return Number(montant).toLocaleString("fr-FR") + " FCFA";

}


function statutTexte(statut){

    const statuts = {

        "a-demarrer":"À démarrer",

        "en-cours":"En cours",

        "pause":"En pause",

        "termine":"Terminé"

    };

    return statuts[statut] || statut;

}


function formaterDate(date){

    if(!date) return "Non définie";

    const d = new Date(date + "T00:00:00");

    return d.toLocaleDateString("fr-FR");

}


/* ===============================
   AFFICHER LES CHANTIERS
================================ */

function afficherChantiers(){

    const chantiers = obtenirChantiers();

    if(chantiers.length === 0){

        emptyState.style.display = "block";

        liste.style.display = "none";

        liste.innerHTML = "";

        return;

    }

    emptyState.style.display = "none";

    liste.style.display = "grid";

    liste.innerHTML = "";

    chantiers.forEach(function(chantier){

        const card =
            document.createElement("article");

        card.className = "chantier-card";

        const avancement =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(chantier.avancement) || 0
                )
            );

        card.innerHTML = `

            <div class="chantier-header">

                <div>

                    <h3>
                        ${echapper(chantier.nom)}
                    </h3>

                    <div class="chantier-client">
                        👤 ${echapper(chantier.client)}
                    </div>

                </div>

                <span class="status ${chantier.statut}">
                    ${statutTexte(chantier.statut)}
                </span>

            </div>

            <div class="info-grid">

                <div class="info">
                    <small>📍 Localisation</small>
                    <strong>
                        ${echapper(chantier.localisation)}
                    </strong>
                </div>

                <div class="info">
                    <small>💰 Budget</small>
                    <strong>
                        ${formaterMontant(chantier.budget)}
                    </strong>
                </div>

                <div class="info">
                    <small>📅 Début</small>
                    <strong>
                        ${formaterDate(chantier.dateDebut)}
                    </strong>
                </div>

                <div class="info">
                    <small>🏁 Fin prévue</small>
                    <strong>
                        ${formaterDate(chantier.dateFin)}
                    </strong>
                </div>

            </div>

            <div class="progress-area">

                <div class="progress-top">

                    <span>Avancement</span>

                    <strong>${avancement}%</strong>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${avancement}%">
                    </div>

                </div>

            </div>

            <div class="card-actions">

                <button
                    class="action-button edit"
                    onclick="modifierChantier('${chantier.id}')">
                    ✏️ Modifier
                </button>

                <button
                    class="action-button delete"
                    onclick="supprimerChantier('${chantier.id}')">
                    🗑️ Supprimer
                </button>

            </div>

        `;

        liste.appendChild(card);

    });

}


/* ===============================
   SECURITE HTML
================================ */

function echapper(texte){

    return String(texte || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ===============================
   MODIFIER
================================ */

function modifierChantier(id){

    const chantiers =
        obtenirChantiers();

    const chantier =
        chantiers.find(function(item){

            return item.id === id;

        });

    if(!chantier) return;

    chantierEnModification = id;

    modalTitle.textContent =
        "Modifier le chantier";

    document.getElementById("nom").value =
        chantier.nom || "";

    document.getElementById("client").value =
        chantier.client || "";

    document.getElementById("localisation").value =
        chantier.localisation || "";

    document.getElementById("dateDebut").value =
        chantier.dateDebut || "";

    document.getElementById("dateFin").value =
        chantier.dateFin || "";

    document.getElementById("budget").value =
        chantier.budget || "";

    document.getElementById("avancement").value =
        chantier.avancement || 0;

    document.getElementById("statut").value =
        chantier.statut || "a-demarrer";

    document.getElementById("notes").value =
        chantier.notes || "";

    modal.classList.add("active");

}


/* ===============================
   SUPPRIMER
================================ */

function supprimerChantier(id){

    const chantiers =
        obtenirChantiers();

    const chantier =
        chantiers.find(function(item){

            return item.id === id;

        });

    if(!chantier) return;

    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer le chantier « " +
            chantier.nom +
            " » ?"
        );

    if(!confirmation) return;

    const nouveauxChantiers =
        chantiers.filter(function(item){

            return item.id !== id;

        });

    sauvegarderChantiers(
        nouveauxChantiers
    );

    afficherChantiers();

}


/* ===============================
   EVENEMENTS
================================ */

nouveauBtn.addEventListener(
    "click",
    ouvrirChantier
);

emptyBtn.addEventListener(
    "click",
    ouvrirChantier
);

closeBtn.addEventListener(
    "click",
    fermerChantier
);

cancelBtn.addEventListener(
    "click",
    fermerChantier
);

modal.addEventListener(
    "click",
    function(event){

        if(event.target === modal){

            fermerChantier();

        }

    }
);


/* ===============================
   ENREGISTREMENT
================================ */

formulaire.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        const chantiers =
            obtenirChantiers();

        const chantier = {

            id:
                chantierEnModification ||
                Date.now().toString(),

            nom:
                document.getElementById("nom").value.trim(),

            client:
                document.getElementById("client").value.trim(),

            localisation:
                document.getElementById("localisation").value.trim(),

            dateDebut:
                document.getElementById("dateDebut").value,

            dateFin:
                document.getElementById("dateFin").value,

            budget:
                document.getElementById("budget").value,

            avancement:
                document.getElementById("avancement").value,

            statut:
                document.getElementById("statut").value,

            notes:
                document.getElementById("notes").value.trim(),

            dateCreation:
                new Date().toISOString()

        };


        if(chantierEnModification){

            const index =
                chantiers.findIndex(function(item){

                    return item.id === chantierEnModification;

                });

            if(index !== -1){

                chantiers[index] = chantier;

            }

        }else{

            chantiers.unshift(chantier);

        }


        sauvegarderChantiers(chantiers);

        afficherChantiers();

        fermerChantier();

        alert(
            chantierEnModification
            ? "✅ Chantier modifié avec succès !"
            : "✅ Chantier enregistré avec succès !"
        );

    }
);


/* ===============================
   CHARGEMENT
================================ */

afficherChantiers();

</script>

</body>
