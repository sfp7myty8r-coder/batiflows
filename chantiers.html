<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chantiers - BATIFLOW</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

.header{
    background:#0f172a;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#f59e0b;
}

.header a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:1200px;
    margin:35px auto;
    padding:0 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.top h1{
    margin:0 0 5px;
}

.top p{
    margin:0;
    color:#6b7280;
}

.primary-button{
    border:none;
    background:#f59e0b;
    color:#111827;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.primary-button:hover{
    background:#d97706;
    color:white;
}

.empty{
    background:white;
    border-radius:12px;
    padding:60px 20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#6b7280;
    margin-bottom:20px;
}

/* LISTE */

.chantiers-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.chantier-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.chantier-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.chantier-header h3{
    margin:0 0 5px;
    font-size:19px;
}

.chantier-client{
    color:#6b7280;
    font-size:13px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status.a-demarrer{
    background:#fef3c7;
    color:#92400e;
}

.status.en-cours{
    background:#dcfce7;
    color:#166534;
}

.status.pause{
    background:#fee2e2;
    color:#991b1b;
}

.status.termine{
    background:#dbeafe;
    color:#1e40af;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0;
}

.info{
    background:#f8fafc;
    padding:12px;
    border-radius:8px;
}

.info small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.info strong{
    font-size:14px;
}

.progress-area{
    margin-top:15px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:6px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#f59e0b;
    border-radius:20px;
}

.card-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.action-button{
    flex:1;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    border:1px solid #d1d5db;
    background:white;
}

.action-button.edit:hover{
    background:#fef3c7;
}

.action-button.delete{
    color:#b91c1c;
}

.action-button.delete:hover{
    background:#fee2e2;
}

/* MODALE */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:14px;
    padding:30px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-header h2{
    margin:0;
}

.close{
    border:none;
    background:transparent;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,.12);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:25px;
}

.secondary-button{
    border:1px solid #d1d5db;
    background:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
}

.secondary-button:hover{
    background:#f8fafc;
}

.submit-button{
    border:none;
    background:#0f172a;
    color:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.submit-button:hover{
    background:#1e293b;
}

.client-helper{
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.client-helper-text{
    font-size:11px;
    color:#6b7280;
}

.client-link{
    color:#2563eb;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.client-link:hover{
    text-decoration:underline;
}

.no-client-message{
    padding:10px 12px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:7px;
    color:#9a3412;
    font-size:12px;
    margin-top:8px;
}

/* TOAST */

.toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:20000;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.toast{
    background:#0f172a;
    color:white;
    padding:14px 18px;
    border-radius:8px;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
    font-size:13px;
    animation:toastIn .25s ease;
}

.toast.success{
    border-left:4px solid #22c55e;
}

.toast.error{
    border-left:4px solid #ef4444;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:800px){
    .chantiers-list{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .header{
        padding:16px 18px;
    }

    .container{
        padding:0 14px;
    }

    .modal-content{
        padding:20px;
    }

    .form-actions{
        flex-direction:column;
    }

    .form-actions button{
        width:100%;
    }
}
</style>

</head>

<body>

<header class="header">

<a href="dashboard.html" class="logo">
    BATI<span>FLOW</span>
</a>

<a href="dashboard.html">
    ← Tableau de bord
</a>

</header>


<main class="container">

<div class="top">

    <div>
        <h1>Mes chantiers</h1>
        <p>Gérez et suivez vos projets de construction.</p>
    </div>

    <button
        type="button"
        class="primary-button"
        id="nouveauChantierBtn">
        + Nouveau chantier
    </button>

</div>


<section id="emptyState" class="empty">

    <h2>🏗️ Aucun chantier</h2>

    <p>
        Commencez par créer votre premier chantier.
    </p>

    <button
        type="button"
        class="primary-button"
        id="emptyButton">
        + Créer un chantier
    </button>

</section>


<section
    id="chantiersList"
    class="chantiers-list"
    style="display:none;">
</section>

</main>


<!-- ===============================
     MODALE CHANTIER
================================ -->

<div class="modal" id="chantierModal">

<div class="modal-content">

    <div class="modal-header">

        <h2 id="modalTitle">
            Nouveau chantier
        </h2>

        <button
            type="button"
            class="close"
            id="closeModal">
            ×
        </button>

    </div>


    <form id="chantierForm">

        <div class="form-grid">


            <!-- NOM -->

            <div class="form-group full">

                <label for="nom">
                    Nom du chantier *
                </label>

                <input
                    type="text"
                    id="nom"
                    placeholder="Ex : Construction maison R+1"
                    required>

            </div>


            <!-- CLIENT -->

            <div class="form-group">

                <label for="clientId">
                    Client *
                </label>

                <select
                    id="clientId"
                    required>

                    <option value="">
                        -- Sélectionner un client --
                    </option>

                </select>

                <div
                    id="clientHelper"
                    class="client-helper">
                </div>

            </div>


            <!-- LOCALISATION -->

            <div class="form-group">

                <label for="localisation">
                    Localisation *
                </label>

                <input
                    type="text"
                    id="localisation"
                    placeholder="Ex : Lomé, Agoè"
                    required>

            </div>


            <!-- DATE DEBUT -->

            <div class="form-group">

                <label for="dateDebut">
                    Date de début
                </label>

                <input
                    type="date"
                    id="dateDebut">

            </div>


            <!-- DATE FIN -->

            <div class="form-group">

                <label for="dateFin">
                    Fin prévue
                </label>

                <input
                    type="date"
                    id="dateFin">

            </div>


            <!-- BUDGET -->

            <div class="form-group">

                <label for="budget">
                    Budget (FCFA)
                </label>

                <input
                    type="number"
                    id="budget"
                    min="0"
                    placeholder="Ex : 15000000">

            </div>


            <!-- AVANCEMENT -->

            <div class="form-group">

                <label for="avancement">
                    Avancement (%)
                </label>

                <input
                    type="number"
                    id="avancement"
                    min="0"
                    max="100"
                    value="0">

            </div>


            <!-- STATUT -->

            <div class="form-group">

                <label for="statut">
                    Statut
                </label>

                <select id="statut">

                    <option value="a-demarrer">
                        À démarrer
                    </option>

                    <option value="en-cours">
                        En cours
                    </option>

                    <option value="pause">
                        En pause
                    </option>

                    <option value="termine">
                        Terminé
                    </option>

                </select>

            </div>


            <!-- NOTES -->

            <div class="form-group full">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Informations complémentaires..."></textarea>

            </div>


        </div>


        <div class="form-actions">

            <button
                type="button"
                class="secondary-button"
                id="cancelButton">
                Annuler
            </button>

            <button
                type="submit"
                class="submit-button">
                Enregistrer le chantier
            </button>

        </div>

    </form>

</div>

</div>


<!-- TOAST -->

<div
    id="toastContainer"
    class="toast-container">
</div>


<script>

/* =====================================================
   STOCKAGE BATIFLOW
===================================================== */

const STORAGE_KEY =
    "batiflowChantiers";

const CLIENT_STORAGE_KEY =
    "batiflowClients";


let chantierEnModification = null;


/* =====================================================
   ELEMENTS
===================================================== */

const nouveauBtn =
    document.getElementById(
        "nouveauChantierBtn"
    );

const emptyBtn =
    document.getElementById(
        "emptyButton"
    );

const modal =
    document.getElementById(
        "chantierModal"
    );

const closeBtn =
    document.getElementById(
        "closeModal"
    );

const cancelBtn =
    document.getElementById(
        "cancelButton"
    );

const formulaire =
    document.getElementById(
        "chantierForm"
    );

const liste =
    document.getElementById(
        "chantiersList"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const clientSelect =
    document.getElementById(
        "clientId"
    );

const clientHelper =
    document.getElementById(
        "clientHelper"
    );


/* =====================================================
   OBTENIR CLIENTS
===================================================== */

function obtenirClients(){

    try{

        const data =
            localStorage.getItem(
                CLIENT_STORAGE_KEY
            );

        if(!data){
            return [];
        }

        const clients =
            JSON.parse(data);

        return Array.isArray(clients)
            ? clients
            : [];

    }catch(error){

        console.error(
            "Erreur lecture clients :",
            error
        );

        return [];

    }

}


/* =====================================================
   OBTENIR CHANTIERS
===================================================== */

function obtenirChantiers(){

    try{

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!data){
            return [];
        }

        const chantiers =
            JSON.parse(data);

        return Array.isArray(chantiers)
            ? chantiers
            : [];

    }catch(error){

        console.error(
            "Erreur lecture chantiers :",
            error
        );

        return [];

    }

}


/* =====================================================
   SAUVEGARDER CHANTIERS
===================================================== */

function sauvegarderChantiers(
    chantiers
){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chantiers)
    );

}


/* =====================================================
   GENERER ID
===================================================== */

function genererId(){

    return (
        "chantier_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8)
    );

}


/* =====================================================
   ECHAPPER HTML
===================================================== */

function echapper(
    texte
){

    return String(
        texte || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   INITIALISATION LISTE CLIENTS
===================================================== */

function chargerClients(){

    const clients =
        obtenirClients();

    const ancienneValeur =
        clientSelect.value;


    clientSelect.innerHTML = `
        <option value="">
            -- Sélectionner un client --
        </option>
    `;


    if(
        clients.length === 0
    ){

        clientSelect.innerHTML += `
            <option value="" disabled>
                Aucun client enregistré
            </option>
        `;

        clientHelper.innerHTML = `
            <div class="no-client-message">
                ⚠️ Aucun client enregistré.
                <a
                    href="clients.html"
                    class="client-link">
                    Créer un client
                </a>
            </div>
        `;

        return;

    }


    clients.forEach(
        function(client){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                client.id;

            let texte =
                client.nom ||
                "Client sans nom";

            if(
                client.entreprise &&
                client.entreprise.trim()
            ){

                texte +=
                    " — " +
                    client.entreprise;

            }

            option.textContent =
                texte;

            clientSelect.appendChild(
                option
            );

        }
    );


    clientHelper.innerHTML = `
        <span class="client-helper-text">
            ${clients.length}
            client${clients.length > 1 ? "s" : ""}
            disponible${clients.length > 1 ? "s" : ""}
        </span>

        <a
            href="clients.html"
            class="client-link">
            + Nouveau client
        </a>
    `;


    if(ancienneValeur){

        const existe =
            clients.some(
                client =>
                    String(client.id) ===
                    String(ancienneValeur)
            );

        if(existe){

            clientSelect.value =
                ancienneValeur;

        }

    }

}


/* =====================================================
   OBTENIR CLIENT SELECTIONNE
===================================================== */

function obtenirClientSelectionne(){

    const clientId =
        clientSelect.value;

    if(!clientId){
        return null;
    }

    const clients =
        obtenirClients();

    return clients.find(
        client =>
            String(client.id) ===
            String(clientId)
    ) || null;

}


/* =====================================================
   TROUVER CLIENT PAR NOM
   POUR ANCIENS CHANTIERS
===================================================== */

function trouverClientParNom(
    nom
){

    if(!nom){
        return null;
    }

    const clients =
        obtenirClients();

    const recherche =
        String(nom)
            .trim()
            .toLowerCase();


    return clients.find(
        client => {

            return (
                client.nom &&
                String(client.nom)
                    .trim()
                    .toLowerCase() ===
                recherche
            );

        }
    ) || null;

}


/* =====================================================
   OUVRIR NOUVEAU CHANTIER
===================================================== */

function ouvrirChantier(){

    chantierEnModification =
        null;

    modalTitle.textContent =
        "Nouveau chantier";

    formulaire.reset();

    document.getElementById(
        "avancement"
    ).value = 0;

    chargerClients();

    modal.classList.add(
        "active"
    );

}


/* =====================================================
   FERMER
===================================================== */

function fermerChantier(){

    modal.classList.remove(
        "active"
    );

    chantierEnModification =
        null;

}


/* =====================================================
   FORMATAGE MONTANT
===================================================== */

function formaterMontant(
    montant
){

    if(
        montant === null ||
        montant === undefined ||
        montant === "" ||
        Number(montant) === 0
    ){

        return "Non défini";

    }

    return Number(
        montant
    ).toLocaleString(
        "fr-FR"
    ) + " FCFA";

}


/* =====================================================
   STATUT
===================================================== */

function statutTexte(
    statut
){

    const statuts = {

        "a-demarrer":
            "À démarrer",

        "en-cours":
            "En cours",

        "pause":
            "En pause",

        "termine":
            "Terminé"

    };

    return (
        statuts[statut] ||
        statut ||
        "À démarrer"
    );

}


/* =====================================================
   DATE
===================================================== */

function formaterDate(
    date
){

    if(!date){
        return "Non définie";
    }

    try{

        const d =
            new Date(
                date + "T00:00:00"
            );

        return d.toLocaleDateString(
            "fr-FR"
        );

    }catch(error){

        return "Non définie";

    }

}


/* =====================================================
   AFFICHER CHANTIERS
===================================================== */

function afficherChantiers(){

    const chantiers =
        obtenirChantiers();


    if(
        chantiers.length === 0
    ){

        emptyState.style.display =
            "block";

        liste.style.display =
            "none";

        liste.innerHTML =
            "";

        return;

    }


    emptyState.style.display =
        "none";

    liste.style.display =
        "grid";

    liste.innerHTML =
        "";


    chantiers.forEach(
        function(chantier){

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "chantier-card";


            const avancement =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Number(
                            chantier.avancement
                        ) || 0
                    )
                );


            const client =
                trouverClientPourChantier(
                    chantier
                );


            let nomClient =
                chantier.client ||
                "Client non renseigné";


            if(client){

                nomClient =
                    client.nom ||
                    nomClient;

            }


            card.innerHTML = `

                <div class="chantier-header">

                    <div>

                        <h3>
                            ${echapper(
                                chantier.nom
                            )}
                        </h3>

                        <div class="chantier-client">
                            👤 ${echapper(
                                nomClient
                            )}
                        </div>

                    </div>

                    <span class="status ${
                        echapper(
                            chantier.statut ||
                            "a-demarrer"
                        )
                    }">

                        ${echapper(
                            statutTexte(
                                chantier.statut
                            )
                        )}

                    </span>

                </div>


                <div class="info-grid">

                    <div class="info">

                        <small>
                            📍 Localisation
                        </small>

                        <strong>
                            ${echapper(
                                chantier.localisation
                            )}
                        </strong>

                    </div>


                    <div class="info">

                        <small>
                            💰 Budget
                        </small>

                        <strong>
                            ${formaterMontant(
                                chantier.budget
                            )}
                        </strong>

                    </div>


                    <div class="info">

                        <small>
                            📅 Début
                        </small>

                        <strong>
                            ${formaterDate(
                                chantier.dateDebut
                            )}
                        </strong>

                    </div>


                    <div class="info">

                        <small>
                            🏁 Fin prévue
                        </small>

                        <strong>
                            ${formaterDate(
                                chantier.dateFin
                            )}
                        </strong>

                    </div>

                </div>


                <div class="progress-area">

                    <div class="progress-top">

                        <span>
                            Avancement
                        </span>

                        <strong>
                            ${avancement}%
                        </strong>

                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${avancement}%">
                        </div>

                    </div>

                </div>


                <div class="card-actions">

                    <button
                        class="action-button edit"
                        onclick="modifierChantier('${echapper(
                            chantier.id
                        )}')">

                        ✏️ Modifier

                    </button>


                    <button
                        class="action-button delete"
                        onclick="supprimerChantier('${echapper(
                            chantier.id
                        )}')">

                        🗑️ Supprimer

                    </button>

                </div>

            `;


            liste.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   TROUVER CLIENT POUR CHANTIER
===================================================== */

function trouverClientPourChantier(
    chantier
){

    const clients =
        obtenirClients();


    if(
        chantier.clientId
    ){

        const parId =
            clients.find(
                client =>
                    String(client.id) ===
                    String(
                        chantier.clientId
                    )
            );

        if(parId){
            return parId;
        }

    }


    if(
        chantier.client
    ){

        const parNom =
            trouverClientParNom(
                chantier.client
            );

        if(parNom){
            return parNom;
        }

    }


    return null;

}


/* =====================================================
   MODIFIER CHANTIER
===================================================== */

function modifierChantier(
    id
){

    const chantiers =
        obtenirChantiers();


    const chantier =
        chantiers.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!chantier){

        afficherToast(
            "❌ Chantier introuvable.",
            "error"
        );

        return;

    }


    chantierEnModification =
        chantier.id;


    modalTitle.textContent =
        "Modifier le chantier";


    chargerClients();


    document.getElementById(
        "nom"
    ).value =
        chantier.nom || "";


    let clientId =
        chantier.clientId ||
        "";


    /*
       Compatibilité avec les anciens
       chantiers qui n'avaient pas clientId.
    */

    if(!clientId){

        const ancienClient =
            trouverClientParNom(
                chantier.client
            );

        if(ancienClient){

            clientId =
                ancienClient.id;

        }

    }


    clientSelect.value =
        clientId;


    document.getElementById(
        "localisation"
    ).value =
        chantier.localisation || "";


    document.getElementById(
        "dateDebut"
    ).value =
        chantier.dateDebut || "";


    document.getElementById(
        "dateFin"
    ).value =
        chantier.dateFin || "";


    document.getElementById(
        "budget"
    ).value =
        chantier.budget || "";


    document.getElementById(
        "avancement"
    ).value =
        chantier.avancement || 0;


    document.getElementById(
        "statut"
    ).value =
        chantier.statut ||
        "a-demarrer";


    document.getElementById(
        "notes"
    ).value =
        chantier.notes || "";


    modal.classList.add(
        "active"
    );

}


/* =====================================================
   SUPPRIMER
===================================================== */

function supprimerChantier(
    id
){

    const chantiers =
        obtenirChantiers();


    const chantier =
        chantiers.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!chantier){

        afficherToast(
            "❌ Chantier introuvable.",
            "error"
        );

        return;

    }


    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer le chantier « " +
            chantier.nom +
            " » ?"
        );


    if(!confirmation){
        return;
    }


    const nouveauxChantiers =
        chantiers.filter(
            function(item){

                return String(item.id) !==
                    String(id);

            }
        );


    sauvegarderChantiers(
        nouveauxChantiers
    );


    afficherChantiers();


    afficherToast(
        "✅ Chantier supprimé.",
        "success"
    );

}


/* =====================================================
   ENREGISTREMENT
===================================================== */

formulaire.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const chantiers =
            obtenirChantiers();


        const client =
            obtenirClientSelectionne();


        if(!client){

            afficherToast(
                "⚠️ Veuillez sélectionner un client.",
                "error"
            );

            clientSelect.focus();

            return;

        }


        const nom =
            document.getElementById(
                "nom"
            ).value.trim();


        const localisation =
            document.getElementById(
                "localisation"
            ).value.trim();


        if(!nom){

            afficherToast(
                "⚠️ Veuillez saisir le nom du chantier.",
                "error"
            );

            return;

        }


        if(!localisation){

            afficherToast(
                "⚠️ Veuillez saisir la localisation.",
                "error"
            );

            return;

        }


        /*
           Si modification :
           on conserve la date de création
           existante.
        */

        let ancienChantier =
            null;


        if(
            chantierEnModification
        ){

            ancienChantier =
                chantiers.find(
                    item =>
                        String(item.id) ===
                        String(
                            chantierEnModification
                        )
                );

        }


        const maintenant =
            new Date().toISOString();


        const chantier = {

            id:
                chantierEnModification ||
                genererId(),

            nom:

                nom,

            /*
               IMPORTANT :
               clientId permet maintenant
               de relier réellement le
               chantier au client.
            */

            clientId:
                client.id,

            /*
               On conserve également
               le nom pour compatibilité
               avec l'ancien BATIFLOW.
            */

            client:
                client.nom || "",

            clientNom:
                client.nom || "",

            entrepriseClient:
                client.entreprise || "",

            localisation:

                localisation,

            dateDebut:

                document.getElementById(
                    "dateDebut"
                ).value,

            dateFin:

                document.getElementById(
                    "dateFin"
                ).value,

            budget:

                document.getElementById(
                    "budget"
                ).value,

            avancement:

                document.getElementById(
                    "avancement"
                ).value,

            statut:

                document.getElementById(
                    "statut"
                ).value,

            notes:

                document.getElementById(
                    "notes"
                ).value.trim(),

            dateCreation:

                ancienChantier &&
                ancienChantier.dateCreation

                    ? ancienChantier.dateCreation

                    : maintenant,

            updatedAt:

                maintenant

        };


        if(
            chantierEnModification
        ){

            const index =
                chantiers.findIndex(
                    function(item){

                        return String(item.id) ===
                            String(
                                chantierEnModification
                            );

                    }
                );


            if(index !== -1){

                chantiers[index] =
                    chantier;

            }


            sauvegarderChantiers(
                chantiers
            );


            afficherChantiers();

            fermerChantier();


            afficherToast(
                "✅ Chantier modifié avec succès.",
                "success"
            );


        }else{

            chantiers.unshift(
                chantier
            );


            sauvegarderChantiers(
                chantiers
            );


            afficherChantiers();

            fermerChantier();


            afficherToast(
                "✅ Chantier enregistré avec succès.",
                "success"
            );

        }

    }
);

/* =====================================================
   SYNCHRONISATION CLIENTS
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            CLIENT_STORAGE_KEY
        ){

            chargerClients();

            afficherChantiers();

        }


        if(
            event.key ===
            STORAGE_KEY
        ){

            afficherChantiers();

        }

    }
);

===================================================== */

function initialiser(){

    chargerClients();

    afficherChantiers();

}


initialiser();
