<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chantiers - BATIFLOW</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#0f172a;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#f59e0b;
}

.header a{
    color:white;
    text-decoration:none;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1200px;
    margin:35px auto;
    padding:0 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.top h1{
    margin:0 0 5px;
}

.top p{
    margin:0;
    color:#6b7280;
}

/* =====================================================
   BUTTONS
===================================================== */

.primary-button{
    border:none;
    background:#f59e0b;
    color:#111827;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.primary-button:hover{
    background:#d97706;
    color:white;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    background:white;
    border-radius:12px;
    padding:60px 20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#6b7280;
    margin-bottom:20px;
}

/* =====================================================
   LISTE
===================================================== */

.chantiers-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.chantier-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.chantier-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.chantier-header h3{
    margin:0 0 5px;
    font-size:19px;
}

.chantier-client{
    color:#6b7280;
    font-size:13px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status.a-demarrer{
    background:#fef3c7;
    color:#92400e;
}

.status.en-cours{
    background:#dcfce7;
    color:#166534;
}

.status.pause{
    background:#fee2e2;
    color:#991b1b;
}

.status.termine{
    background:#dbeafe;
    color:#1e40af;
}

/* =====================================================
   INFO GRID
===================================================== */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0;
}

.info{
    background:#f8fafc;
    padding:12px;
    border-radius:8px;
}

.info small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.info strong{
    font-size:14px;
}

/* =====================================================
   PROGRESS
===================================================== */

.progress-area{
    margin-top:15px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:6px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#f59e0b;
    border-radius:20px;
}

/* =====================================================
   FINANCE MINI
===================================================== */

.finance-summary{
    margin-top:18px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    border:1px solid #e5e7eb;
}

.finance-summary-title{
    font-size:12px;
    font-weight:bold;
    margin-bottom:12px;
    color:#475569;
}

.finance-mini-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.finance-mini{
    background:white;
    border-radius:8px;
    padding:10px;
    border:1px solid #e5e7eb;
}

.finance-mini small{
    display:block;
    color:#64748b;
    font-size:10px;
    margin-bottom:4px;
}

.finance-mini strong{
    font-size:12px;
}

.finance-positive{
    color:#15803d;
}

.finance-negative{
    color:#b91c1c;
}

.finance-warning{
    color:#b45309;
}

/* =====================================================
   ACTIONS
===================================================== */

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.action-button{
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    border:1px solid #d1d5db;
    background:white;
}

.action-button.edit:hover{
    background:#fef3c7;
}

.action-button.finance{
    background:#fff7ed;
    border-color:#fed7aa;
    color:#9a3412;
}

.action-button.finance:hover{
    background:#f59e0b;
    color:white;
}

.action-button.delete{
    color:#b91c1c;
}

.action-button.delete:hover{
    background:#fee2e2;
}

.action-button.full{
    grid-column:1/-1;
}

/* =====================================================
   MODALE GENERALE
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:14px;
    padding:30px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-header h2{
    margin:0;
}

.close{
    border:none;
    background:transparent;
    font-size:28px;
    cursor:pointer;
}

/* =====================================================
   FORM
===================================================== */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,.12);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:25px;
}

.secondary-button{
    border:1px solid #d1d5db;
    background:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
}

.secondary-button:hover{
    background:#f8fafc;
}

.submit-button{
    border:none;
    background:#0f172a;
    color:white;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.submit-button:hover{
    background:#1e293b;
}

/* =====================================================
   CLIENT
===================================================== */

.client-helper{
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.client-helper-text{
    font-size:11px;
    color:#6b7280;
}

.client-link{
    color:#2563eb;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.client-link:hover{
    text-decoration:underline;
}

.no-client-message{
    padding:10px 12px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:7px;
    color:#9a3412;
    font-size:12px;
    margin-top:8px;
}

/* =====================================================
   FINANCE MODAL
===================================================== */

.finance-modal-content{
    max-width:900px;
}

.finance-project-header{
    background:#0f172a;
    color:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.finance-project-header h3{
    margin:0 0 5px;
    font-size:20px;
}

.finance-project-header p{
    margin:0;
    color:#cbd5e1;
    font-size:13px;
}

.finance-dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:22px;
}

.finance-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
}

.finance-box small{
    display:block;
    color:#64748b;
    font-size:11px;
    margin-bottom:6px;
}

.finance-box strong{
    font-size:16px;
}

.finance-box.budget{
    border-left:4px solid #f59e0b;
}

.finance-box.depenses{
    border-left:4px solid #ef4444;
}

.finance-box.recettes{
    border-left:4px solid #22c55e;
}

.finance-box.resultat{
    border-left:4px solid #3b82f6;
}

.finance-progress{
    margin-bottom:25px;
}

.finance-progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:12px;
    font-weight:bold;
}

.finance-progress-bar{
    height:12px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.finance-progress-fill{
    height:100%;
    background:#f59e0b;
    border-radius:20px;
}

.finance-progress-fill.danger{
    background:#ef4444;
}

.finance-progress-fill.success{
    background:#22c55e;
}

/* =====================================================
   FINANCE FORMS
===================================================== */

.finance-forms{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:25px;
}

.finance-form-card{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:18px;
}

.finance-form-card h3{
    margin:0 0 15px;
    font-size:16px;
}

.finance-form-card.expense h3{
    color:#b91c1c;
}

.finance-form-card.income h3{
    color:#15803d;
}

/* =====================================================
   OPERATIONS
===================================================== */

.operations-title{
    margin:0 0 12px;
    font-size:17px;
}

.operations-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.operation{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:13px;
    border:1px solid #e5e7eb;
    border-radius:9px;
    background:#fff;
}

.operation-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.operation-icon{
    width:36px;
    height:36px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.operation-icon.depense{
    background:#fee2e2;
}

.operation-icon.recette{
    background:#dcfce7;
}

.operation-info strong{
    display:block;
    font-size:13px;
}

.operation-info small{
    display:block;
    color:#64748b;
    font-size:11px;
    margin-top:3px;
}

.operation-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.operation-amount{
    font-weight:bold;
    font-size:13px;
}

.operation-amount.depense{
    color:#b91c1c;
}

.operation-amount.recette{
    color:#15803d;
}

.delete-operation{
    border:none;
    background:#fee2e2;
    color:#b91c1c;
    width:30px;
    height:30px;
    border-radius:6px;
    cursor:pointer;
}

.delete-operation:hover{
    background:#fecaca;
}

.no-operation{
    text-align:center;
    padding:25px;
    background:#f8fafc;
    border-radius:9px;
    color:#64748b;
    font-size:13px;
}

/* =====================================================
   TOAST
===================================================== */

.toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:20000;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.toast{
    background:#0f172a;
    color:white;
    padding:14px 18px;
    border-radius:8px;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
    font-size:13px;
    animation:toastIn .25s ease;
}

.toast.success{
    border-left:4px solid #22c55e;
}

.toast.error{
    border-left:4px solid #ef4444;
}

@keyframes toastIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .finance-dashboard{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:800px){

    .chantiers-list{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .header{
        padding:16px 18px;
    }

    .container{
        padding:0 14px;
    }

    .modal-content{
        padding:20px;
    }

    .form-actions{
        flex-direction:column;
    }

    .form-actions button{
        width:100%;
    }

    .finance-dashboard{
        grid-template-columns:1fr 1fr;
    }

    .finance-forms{
        grid-template-columns:1fr;
    }

    .finance-mini-grid{
        grid-template-columns:1fr;
    }

    .card-actions{
        grid-template-columns:1fr;
    }

    .operation{
        align-items:flex-start;
    }

    .operation-right{
        flex-direction:column;
        align-items:flex-end;
    }

}

@media(max-width:480px){

    .finance-dashboard{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header class="header">

<a href="dashboard.html" class="logo">
    BATI<span>FLOW</span>
</a>

<a href="dashboard.html">
    ← Tableau de bord
</a>

</header>


<main class="container">

<div class="top">

    <div>

        <h1>Mes chantiers</h1>

        <p>
            Gérez et suivez vos projets de construction.
        </p>

    </div>

    <button
        type="button"
        class="primary-button"
        id="nouveauChantierBtn">

        + Nouveau chantier

    </button>

</div>


<section id="emptyState" class="empty">

    <h2>🏗️ Aucun chantier</h2>

    <p>
        Commencez par créer votre premier chantier.
    </p>

    <button
        type="button"
        class="primary-button"
        id="emptyButton">

        + Créer un chantier

    </button>

</section>


<section
    id="chantiersList"
    class="chantiers-list"
    style="display:none;">

</section>

</main>


<!-- =====================================================
     MODALE CHANTIER
===================================================== -->

<div class="modal" id="chantierModal">

<div class="modal-content">

    <div class="modal-header">

        <h2 id="modalTitle">
            Nouveau chantier
        </h2>

        <button
            type="button"
            class="close"
            id="closeModal">

            ×

        </button>

    </div>


    <form id="chantierForm">

        <div class="form-grid">


            <div class="form-group full">

                <label for="nom">
                    Nom du chantier *
                </label>

                <input
                    type="text"
                    id="nom"
                    placeholder="Ex : Construction maison R+1"
                    required>

            </div>


            <div class="form-group">

                <label for="clientId">
                    Client *
                </label>

                <select
                    id="clientId"
                    required>

                    <option value="">
                        -- Sélectionner un client --
                    </option>

                </select>

                <div
                    id="clientHelper"
                    class="client-helper">

                </div>

            </div>


            <div class="form-group">

                <label for="localisation">
                    Localisation *
                </label>

                <input
                    type="text"
                    id="localisation"
                    placeholder="Ex : Lomé, Agoè"
                    required>

            </div>


            <div class="form-group">

                <label for="dateDebut">
                    Date de début
                </label>

                <input
                    type="date"
                    id="dateDebut">

            </div>


            <div class="form-group">

                <label for="dateFin">
                    Fin prévue
                </label>

                <input
                    type="date"
                    id="dateFin">

            </div>


            <div class="form-group">

                <label for="budget">
                    Budget (FCFA)
                </label>

                <input
                    type="number"
                    id="budget"
                    min="0"
                    placeholder="Ex : 15000000">

            </div>


            <div class="form-group">

                <label for="avancement">
                    Avancement (%)
                </label>

                <input
                    type="number"
                    id="avancement"
                    min="0"
                    max="100"
                    value="0">

            </div>


            <div class="form-group">

                <label for="statut">
                    Statut
                </label>

                <select id="statut">

                    <option value="a-demarrer">
                        À démarrer
                    </option>

                    <option value="en-cours">
                        En cours
                    </option>

                    <option value="pause">
                        En pause
                    </option>

                    <option value="termine">
                        Terminé
                    </option>

                </select>

            </div>


            <div class="form-group full">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Informations complémentaires..."></textarea>

            </div>


        </div>


        <div class="form-actions">

            <button
                type="button"
                class="secondary-button"
                id="cancelButton">

                Annuler

            </button>

            <button
                type="submit"
                class="submit-button">

                Enregistrer le chantier

            </button>

        </div>

    </form>

</div>

</div>


<!-- =====================================================
     MODALE BUDGET / RENTABILITE
===================================================== -->

<div class="modal" id="financeModal">

<div class="modal-content finance-modal-content">

    <div class="modal-header">

        <h2>
            💰 Budget & Rentabilité
        </h2>

        <button
            type="button"
            class="close"
            id="closeFinanceModal">

            ×

        </button>

    </div>


    <div
        id="financeProjectHeader"
        class="finance-project-header">

    </div>


    <!-- TABLEAU FINANCIER -->

    <div
        id="financeDashboard"
        class="finance-dashboard">

    </div>


    <!-- BARRE CONSOMMATION -->

    <div class="finance-progress">

        <div class="finance-progress-top">

            <span>
                Consommation du budget
            </span>

            <strong id="financePercent">
                0 %
            </strong>

        </div>

        <div class="finance-progress-bar">

            <div
                id="financeProgressFill"
                class="finance-progress-fill"
                style="width:0%;">

            </div>

        </div>

    </div>


    <!-- FORMULAIRES -->

    <div class="finance-forms">


        <!-- DEPENSE -->

        <div class="finance-form-card expense">

            <h3>
                💸 Ajouter une dépense
            </h3>

            <form id="depenseForm">

                <div class="form-group">

                    <label for="depenseLibelle">
                        Libellé *
                    </label>

                    <input
                        type="text"
                        id="depenseLibelle"
                        placeholder="Ex : Achat ciment"
                        required>

                </div>


                <div class="form-group">

                    <label for="depenseCategorie">
                        Catégorie
                    </label>

                    <select id="depenseCategorie">

                        <option value="Matériaux">
                            Matériaux
                        </option>

                        <option value="Main-d'œuvre">
                            Main-d'œuvre
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Engins">
                            Engins
                        </option>

                        <option value="Fournitures">
                            Fournitures
                        </option>

                        <option value="Sous-traitance">
                            Sous-traitance
                        </option>

                        <option value="Autre">
                            Autre
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="depenseMontant">
                        Montant (FCFA) *
                    </label>

                    <input
                        type="number"
                        id="depenseMontant"
                        min="1"
                        placeholder="Ex : 250000"
                        required>

                </div>


                <div class="form-group">

                    <label for="depenseDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="depenseDate">

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="submit-button">

                        + Enregistrer la dépense

                    </button>

                </div>

            </form>

        </div>


        <!-- RECETTE -->

        <div class="finance-form-card income">

            <h3>
                📥 Ajouter une recette
            </h3>

            <form id="recetteForm">

                <div class="form-group">

                    <label for="recetteLibelle">
                        Libellé *
                    </label>

                    <input
                        type="text"
                        id="recetteLibelle"
                        placeholder="Ex : Avance client"
                        required>

                </div>


                <div class="form-group">

                    <label for="recetteCategorie">
                        Type
                    </label>

                    <select id="recetteCategorie">

                        <option value="Paiement client">
                            Paiement client
                        </option>

                        <option value="Avance">
                            Avance
                        </option>

                        <option value="Acompte">
                            Acompte
                        </option>

                        <option value="Solde">
                            Solde
                        </option>

function echapper(

){

        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

===================================================== */

    nom
){

    if(!nom){
        return null;

    const clients =
        obtenirClients();

    const recherche =
        String(nom)
            .trim()
            .toLowerCase();


    return clients.find(
        client => {

            return (
                client.nom &&
                String(client.nom)
                    .trim()
                    .toLowerCase() ===
                recherche
            );

        }
    ) || null;

/* =====================================================

    chantier
){

                client =>
                    String(client.id) ===
                    String(
                        chantier.clientId

            );

        if(parId){

    if(
        chantier.client

            trouverClientParNom(
                chantier.client

        if(parNom){

    }


    return null;

function formaterMontant(

){

        montant === undefined ||
        montant === "" ||
        Number(montant) === 0
    ){

        return "Non défini";

    }

    return Number(
        montant

/* =====================================================

===================================================== */

function formaterDate(
    date
){

    if(!date){
        return "Non définie";
    }

    try{

        const d =
            new Date(

            );

        return d.toLocaleDateString(

/* =====================================================
   CALCUL FINANCIER
===================================================== */

function calculerFinancesChantier(
    chantier
){

    const operations =
        obtenirFinancesChantier(
            chantier.id
        );


    const budget =
        Number(
            chantier.budget
        ) || 0;


    const depenses =
        operations
            .filter(
                operation =>
                    operation.type ===
                    "depense"
            )
            .reduce(
                (
                    total,
                    operation
                ) =>
                    total +
                    Number(
                        operation.montant
                    ),
                0
            );


    const recettes =
        operations
            .filter(
                operation =>
                    operation.type ===
                    "recette"
            )
            .reduce(
                (
                    total,
                    operation
                ) =>
                    total +
                    Number(
                        operation.montant
                    ),
                0
            );


    const restant =
        budget -
        depenses;


    const resultat =
        recettes -
        depenses;


    let consommation = 0;

    if(budget > 0){

        consommation =
            (
                depenses /
                budget
            ) * 100;

    }


    return {

        budget,
        depenses,
        recettes,
        restant,
        resultat,
        consommation,
        operations

    };

}

/* =====================================================
   MODIFIER CHANTIER
===================================================== */

function modifierChantier(
    id
){

    const chantiers =
        obtenirChantiers();


    const chantier =
        chantiers.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!chantier){

        afficherToast(
            "❌ Chantier introuvable.",
            "error"
        );

        return;

    }


    chantierEnModification =
        chantier.id;


    modalTitle.textContent =
        "Modifier le chantier";


    chargerClients();


    document.getElementById(
        "nom"
    ).value =
        chantier.nom || "";


    let clientId =
        chantier.clientId ||
        "";


    if(!clientId){

        const ancienClient =
            trouverClientParNom(
                chantier.client
            );

        if(ancienClient){

            clientId =
                ancienClient.id;

        }

    }


    clientSelect.value =
        clientId;


    document.getElementById(
        "localisation"
    ).value =
        chantier.localisation || "";


    document.getElementById(
        "dateDebut"
    ).value =
        chantier.dateDebut || "";


    document.getElementById(
        "dateFin"
    ).value =
        chantier.dateFin || "";


    document.getElementById(
        "budget"
    ).value =
        chantier.budget || "";


    document.getElementById(
        "avancement"
    ).value =
        chantier.avancement || 0;


    document.getElementById(
        "statut"
    ).value =
        chantier.statut ||
        "a-demarrer";


    document.getElementById(
        "notes"
    ).value =
        chantier.notes || "";


    modal.classList.add(
        "active"
    );

}


/* =====================================================
   SUPPRIMER CHANTIER
===================================================== */

function supprimerChantier(
    id
){

    const chantiers =
        obtenirChantiers();


    const chantier =
        chantiers.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!chantier){

        afficherToast(
            "❌ Chantier introuvable.",
            "error"
        );

        return;

    }


    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer le chantier « " +
            chantier.nom +
            " » ?"
        );


    if(!confirmation){
        return;
    }


    const nouveauxChantiers =
        chantiers.filter(
            function(item){

                return String(item.id) !==
                    String(id);

            }
        );


    sauvegarderChantiers(
        nouveauxChantiers
    );


    /*
       Suppression des finances
       liées au chantier supprimé.
    */

    const finances =
        obtenirFinances();


    const nouvellesFinances =
        finances.filter(
            operation =>
                String(
                    operation.chantierId
                ) !==
                String(id)
        );


    sauvegarderFinances(
        nouvellesFinances
    );


    afficherChantiers();


    afficherToast(
        "✅ Chantier supprimé.",
        "success"
    );

}


/* =====================================================
   ENREGISTREMENT CHANTIER
===================================================== */

formulaire.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const chantiers =
            obtenirChantiers();


        const client =
            obtenirClientSelectionne();


        if(!client){

            afficherToast(
                "⚠️ Veuillez sélectionner un client.",
                "error"
            );

            clientSelect.focus();

            return;

        }


        const nom =
            document.getElementById(
                "nom"
            ).value.trim();


        const localisation =
            document.getElementById(
                "localisation"
            ).value.trim();


        if(!nom){

            afficherToast(
                "⚠️ Veuillez saisir le nom du chantier.",
                "error"
            );

            return;

        }


        if(!localisation){

            afficherToast(
                "⚠️ Veuillez saisir la localisation.",
                "error"
            );

            return;

        }


        let ancienChantier =
            null;


        if(
            chantierEnModification
        ){

            ancienChantier =
                chantiers.find(
                    item =>
                        String(item.id) ===
                        String(
                            chantierEnModification
                        )
                );

        }


        const maintenant =
            new Date().toISOString();


        const chantier = {

            id:
                chantierEnModification ||
                genererId(),

            nom:
                nom,

            clientId:
                client.id,

            client:
                client.nom || "",

            clientNom:
                client.nom || "",

            entrepriseClient:
                client.entreprise || "",

            localisation:
                localisation,

            dateDebut:
                document.getElementById(
                    "dateDebut"
                ).value,

            dateFin:
                document.getElementById(
                    "dateFin"
                ).value,

            budget:
                document.getElementById(
                    "budget"
                ).value,

            avancement:
                document.getElementById(
                    "avancement"
                ).value,

            statut:
                document.getElementById(
                    "statut"
                ).value,

            notes:
                document.getElementById(
                    "notes"
                ).value.trim(),

            dateCreation:

                ancienChantier &&
                ancienChantier.dateCreation

                    ? ancienChantier.dateCreation

                    : maintenant,

            updatedAt:
                maintenant

        };


        if(
            chantierEnModification
        ){

            const index =
                chantiers.findIndex(
                    function(item){

                        return String(item.id) ===
                            String(
                                chantierEnModification
                            );

                    }
                );


            if(index !== -1){

                chantiers[index] =
                    chantier;

            }


            sauvegarderChantiers(
                chantiers
            );


            afficherChantiers();

            fermerChantier();


            afficherToast(
                "✅ Chantier modifié avec succès.",
                "success"
            );


        }else{

            chantiers.unshift(
                chantier
            );


            sauvegarderChantiers(
                chantiers
            );


            afficherChantiers();

            fermerChantier();


            afficherToast(
                "✅ Chantier enregistré avec succès.",
                "success"
            );

        }

    }
);

    const chantiers =

    const chantier =

                String(item.id) ===
                String(chantierId)
        );


    if(!chantier){

        afficherToast(
            "❌ Chantier introuvable.",
            "error"
        );

        return;

    }


    chantierFinanceActuel =
        chantier.id;


    financeModal.classList.add(
        "active"
    );


    document.getElementById(
        "depenseDate"
    ).value =
        obtenirDateAujourdhui();


    document.getElementById(
        "recetteDate"
    ).value =
        obtenirDateAujourdhui();


    afficherFinances(
        chantier
    );

}

/* =====================================================
   DATE DU JOUR
===================================================== */

function obtenirDateAujourdhui(){

    const maintenant =
        new Date();

    const annee =
        maintenant.getFullYear();

    const mois =
        String(
            maintenant.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const jour =
        String(
            maintenant.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        annee +
        "-" +
        mois +
        "-" +
        jour
    );

}


/* =====================================================
   AFFICHER FINANCES
===================================================== */

function afficherFinances(
    chantier
){

    const finance =
        calculerFinancesChantier(
            chantier
        );


    const client =
        trouverClientPourChantier(
            chantier
        );


    const nomClient =
        client
            ? client.nom
            : (
                chantier.client ||
                "Client non renseigné"
            );


    financeProjectHeader.innerHTML = `

        <h3>
            ${echapper(
                chantier.nom
            )}
        </h3>

        <p>
            👤 ${echapper(
                nomClient
            )}
            &nbsp; • &nbsp;
            📍 ${echapper(
                chantier.localisation
            )}
        </p>

    `;


    financeDashboard.innerHTML = `

        <div class="finance-box budget">

            <small>
                💰 Budget prévu
            </small>

            <strong>
                ${formaterMontant(
                    finance.budget
                )}
            </strong>

        </div>


        <div class="finance-box depenses">

            <small>
                💸 Dépenses
            </small>

            <strong>
                ${formaterMontant(
                    finance.depenses
                )}
            </strong>

        </div>


        <div class="finance-box recettes">

            <small>
                📥 Recettes
            </small>

            <strong>
                ${formaterMontant(
                    finance.recettes
                )}
            </strong>

        </div>


        <div class="finance-box resultat">

            <small>
                📊 Résultat
            </small>

            <strong class="${
                finance.resultat >= 0
                    ? "finance-positive"
                    : "finance-negative"
            }">

                ${formaterMontant(
                    finance.resultat
                )}

            </strong>

        </div>

    `;


    let consommation =
        finance.consommation;


    if(
        !Number.isFinite(
            consommation
        )
    ){

        consommation = 0;

    }


    const consommationWidth =
        Math.min(
            Math.max(
                consommation,
                0
            ),
            100
        );


    financePercent.textContent =
        Math.round(
            consommation
        ) + " %";


    financeProgressFill.style.width =
        consommationWidth + "%";


    financeProgressFill.className =
        "finance-progress-fill";


    if(
        consommation > 100
    ){

        financeProgressFill.classList.add(
            "danger"
        );

    }else if(
        consommation >= 80
    ){

        financeProgressFill.classList.add(
            "danger"
        );

    }else if(
        consommation <= 50
    ){

        financeProgressFill.classList.add(
            "success"
        );

    }


    afficherOperations(
        finance.operations
    );

}


/* =====================================================
   AFFICHER OPERATIONS
===================================================== */

function afficherOperations(
    operations
){

    if(
        operations.length === 0
    ){

        operationsList.innerHTML = `

            <div class="no-operation">

                📋 Aucune opération financière
                enregistrée pour ce chantier.

            </div>

        `;

        return;

    }


    const operationsTriees =
        [...operations].sort(
            function(a,b){

                return new Date(
                    b.dateCreation ||
                    b.date
                ) -
                new Date(
                    a.dateCreation ||
                    a.date
                );

            }
        );


    operationsList.innerHTML =
        "";


    operationsTriees.forEach(
        function(operation){

            const date =
                operation.date
                    ? formaterDate(
                        operation.date
                    )
                    : "Date non définie";


            const estDepense =
                operation.type ===
                "depense";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "operation";


            div.innerHTML = `

                <div class="operation-left">

                    <div class="operation-icon ${
                        estDepense
                            ? "depense"
                            : "recette"
                    }">

                        ${
                            estDepense
                                ? "💸"
                                : "📥"
                        }

                    </div>


                    <div class="operation-info">

                        <strong>
                            ${echapper(
                                operation.libelle
                            )}
                        </strong>

                        <small>

                            ${echapper(
                                operation.categorie ||
                                "Autre"
                            )}

                            •
                            ${echapper(
                                date
                            )}

                        </small>

                    </div>

                </div>


                <div class="operation-right">

                    <span class="operation-amount ${
                        estDepense
                            ? "depense"
                            : "recette"
                    }">

                        ${
                            estDepense
                                ? "-"
                                : "+"
                        }

                        ${formaterMontant(
                            operation.montant
                        )}

                    </span>


                    <button
                        class="delete-operation"
                        title="Supprimer"
                        onclick="supprimerOperation('${echapper(
                            operation.id
                        )}')">

                        ×

                    </button>

                </div>

            `;


            operationsList.appendChild(
                div
            );

        }
    );

}


/* =====================================================

===================================================== */

depenseForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        if(!chantierFinanceActuel){

            afficherToast(
                "❌ Aucun chantier sélectionné.",
                "error"
            );

            return;

        }


        const libelle =
            document.getElementById(
                "depenseLibelle"
            ).value.trim();


        const categorie =
            document.getElementById(
                "depenseCategorie"
            ).value;


        const montant =
            Number(
                document.getElementById(
                    "depenseMontant"
                ).value
            );


        const date =
            document.getElementById(
                "depenseDate"
            ).value ||
            obtenirDateAujourdhui();


        if(!libelle){

            afficherToast(
                "⚠️ Veuillez saisir le libellé.",
                "error"
            );

            return;

        }


        if(
            !montant ||
            montant <= 0
        ){

            afficherToast(
                "⚠️ Veuillez saisir un montant valide.",
                "error"
            );

            return;

        }


        const finances =
            obtenirFinances();


        finances.push({

            id:
                genererFinanceId(),

            chantierId:
                chantierFinanceActuel,

            type:
                "depense",

            libelle:
                libelle,

            categorie:
                categorie,

            montant:
                montant,

            date:
                date,

            dateCreation:
                new Date().toISOString()

        });


        sauvegarderFinances(
            finances
        );


        depenseForm.reset();


        document.getElementById(
            "depenseDate"
        ).value =
            obtenirDateAujourdhui();


        const chantier =
            obtenirChantiers().find(
                item =>
                    String(item.id) ===
                    String(
                        chantierFinanceActuel
                    )
            );


        if(chantier){

            afficherFinances(
                chantier
            );

        }


        afficherChantiers();


        afficherToast(
            "✅ Dépense enregistrée.",
            "success"
        );

    }
);

/* =====================================================
   SUPPRIMER OPERATION
===================================================== */

function supprimerOperation(
    operationId
){

    const confirmation =
        confirm(
            "Voulez-vous supprimer cette opération financière ?"
        );


    if(!confirmation){
        return;
    }


    const finances =
        obtenirFinances();


    const nouvellesFinances =
        finances.filter(
            operation =>
                String(operation.id) !==
                String(operationId)
        );


    sauvegarderFinances(
        nouvellesFinances
    );


    const chantier =
        obtenirChantiers().find(
            item =>
                String(item.id) ===
                String(
                    chantierFinanceActuel
                )
        );


    if(chantier){

        afficherFinances(
            chantier
        );

    }


    afficherChantiers();


    afficherToast(
        "✅ Opération supprimée.",
        "success"
    );

}

/* =====================================================
   TOAST
===================================================== */

function afficherToast(
    message,
    type = "success"
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast " +
        type;


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        function(){

            toast.remove();

        },
        3500
    );

}


/* =====================================================
   SYNCHRONISATION
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            CLIENT_STORAGE_KEY
        ){

            chargerClients();

            afficherChantiers();

        }


        if(
            event.key ===
            STORAGE_KEY
        ){

            afficherChantiers();

        }


        if(
            event.key ===
            FINANCE_STORAGE_KEY
        ){

            afficherChantiers();


            if(
                chantierFinanceActuel
            ){

                const chantier =
                    obtenirChantiers().find(
                        item =>
                            String(item.id) ===
                            String(
                                chantierFinanceActuel
                            )
                    );


                if(chantier){

                    afficherFinances(
                        chantier
                    );

                }

            }

        }

    }
);

   INITIALISATION
===================================================== */

function initialiser(){

    chargerClients();

    afficherChantiers();

}
